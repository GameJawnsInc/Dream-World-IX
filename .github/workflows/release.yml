# Release pipeline for Dream World IX / ff9mapkit.
#
# Builds the (pure-Python) wheel + sdist, generates a license-compliant THIRD-PARTY-NOTICES.txt, and on a
# version tag attaches them to a GitHub Release. Optional PyPI publish via Trusted Publishing (OIDC) is
# wired but OFF until you opt in -- see the `pypi` job.
#
# IMPORTANT: pyproject.toml lives in the ff9mapkit/ subdirectory, not the repo root, so every build step
# runs there. The wheel is py3-none-any (no compiled extensions in ff9mapkit itself).
#
# Trigger: push a tag like `v1.0.0b13`, or run manually from the Actions tab (build + test + notices;
# the release + PyPI-publish jobs are tag-gated, so a manual run never publishes).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        working-directory: ff9mapkit
        run: |
          python -m pip install --upgrade pip build
          python -m build            # -> ff9mapkit/dist/*.whl + *.tar.gz
      - name: Check metadata
        working-directory: ff9mapkit
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Smoke-install the built wheel (clean venv)
        working-directory: ff9mapkit
        # Install the just-built wheel into a fresh venv and exercise the console entry point, so a
        # broken package layout / missing package-data / bad console-script is caught BEFORE publish.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import ff9mapkit; print('import OK', ff9mapkit.__version__)"
          /tmp/smoke/bin/ff9mapkit --help > /dev/null
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: ff9mapkit/dist/*

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + test deps
        working-directory: ff9mapkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev,save,assets]"
      - name: Run tests
        working-directory: ff9mapkit
        # Install-gated tests (which need a local FF9 install) skip automatically on a bare runner, so
        # this exercises the codec / build / authoring suite. The PySide6 Workspace tests are covered by
        # the app's own `--smoke` check and left out here to keep the runner light.
        run: python -m pytest -n auto -q

  version-check:
    name: Tag matches package version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Assert the git tag equals the pyproject version
        working-directory: ff9mapkit
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "git tag = $TAG | pyproject = $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match ff9mapkit/pyproject.toml version $PKG — refusing to publish a mislabeled release."
            exit 1
          fi

  notices:
    name: THIRD-PARTY-NOTICES (Windows)
    # Generate on Windows so the aggregated license metadata matches the wheels Windows users actually get
    # (Pillow / PySide6 / UnityPy ship platform-specific binaries).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + extras + pip-licenses
        run: |
          python -m pip install --upgrade pip pip-licenses
          # Install into THIS interpreter so pip-licenses sees the real shipped dependency set.
          python -m pip install ".[gui,save,assets]"
        working-directory: ff9mapkit
      - name: Generate THIRD-PARTY-NOTICES.txt
        run: python tools/gen_third_party_notices.py -o THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v5
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.txt

  release:
    name: Attach to GitHub Release
    needs: [build, notices, test, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create/update the Release
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: third-party-notices
          path: notices
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true          # review the assets, then click Publish
          generate_release_notes: true
          files: |
            dist/*
            notices/THIRD-PARTY-NOTICES.txt

  # ⚠ PyPI publish is IRREVERSIBLE (a version can never be reused) and fires automatically on a version
  # tag. To make it a reviewed step like the draft GitHub Release, add a REQUIRED REVIEWER to the `pypi`
  # environment (repo Settings → Environments → pypi → "Required reviewers"): the tag push then PAUSES this
  # job for a manual approve click before anything reaches PyPI. Recommended — nothing else here gates the
  # irreversible half. The `needs` below also block publish unless the test suite + tag/version check pass.
  pypi:
    name: Publish to PyPI (Trusted Publishing)
    needs: [build, test, version-check]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi          # add a `pypi` environment + a Trusted Publisher on PyPI to enable
    permissions:
      id-token: write          # OIDC -- no API token/secret needed once Trusted Publishing is configured
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
