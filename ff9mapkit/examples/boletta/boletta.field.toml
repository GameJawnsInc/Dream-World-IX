# Boletta's Glade — the from-scratch-creature example field.
#
# Build order (from a repo checkout's root; each step's output feeds the next):
#   1. py ff9mapkit/examples/boletta/make_creature.py   -> creature/6300.fbx + 6300.png (+ previews)
#   2. deploy this field once (registers the mint id):
#        py tools/deploy_field.py ff9mapkit/examples/boletta/boletta.field.toml
#        (or `ff9mapkit build` + your own deploy for an installed kit)
#   3. py ff9mapkit/examples/boletta/make_creature_anims.py <your mod folder>  -> prints the stand key
#   4. set `anims = { stand = <key> }` below if yours differs, redeploy, RELAUNCH.
#
# CAVEAT: deploy_field reverts the slot's prior deploy first — re-run step 3 after every redeploy
# (the anim's DictionaryPatch line is minted outside the field build and gets rolled back).

[field]
id = 4004
name = "GLADE"
area = 11
text_block = 1073
title = "Boletta's Glade"

[camera]
pitch = 48.0
distance = 4500
fov = 42.2
[camera.frame]
back = 205
front = 432

[walkmesh]
quad = [[-1220, 257], [1220, 257], [1220, -1931], [-1220, -1931]]
frame = "world"

[[layers]]
image = "art/back.png"    # placeholder — repaint to match the camera (ff9mapkit guide)
z = 4000
[[layers]]
image = "art/floor.png"   # placeholder
z = 3000

[player]
spawn = [0, -837]

# The creature: a minted GEO id whose FBX + texture are the generator's output (no FF9 bytes).
[[mint]]
id = 6300
name = "GEO_NPC_F1_M300"
fbx = "creature/6300.fbx"

[[npc]]
name = "Boletta"
model = 6300
pos = [-220, -350]
speaker = "Boletta"        # the dialogue-window name tag (`name` is only the object name)
dialogue = "Grew here all by myself!"
anims = { stand = 60001 }  # from make_creature_anims.py's output (16-bit field band, 60000+)
