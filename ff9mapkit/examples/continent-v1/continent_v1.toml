# continent_v1.toml -- the FIRST CUSTOM CONTINENT: four verbatim donor islands fused
# into one archipelago in the open SW ocean pocket of the disc-1 overworld (block cells
# rows 12-19, cols 0-5 -- clear of every real landmass and every prior scratch deploy),
# plus a REAL-SCALE MINTED BEACH on island B (a kit-made shore: bank_lower + virgin_mint).
#
# Deploy (needs the custom engine's WorldMeshOverride patch). The overworld gets its own
# dedicated mod folder so campaign deploys can never wholesale-replace it:
#   py -m ff9mapkit world-fuse continent_v1.toml --mod-folder FF9CustomMap-world --dry-run   # validate
#   py -m ff9mapkit world-fuse continent_v1.toml --mod-folder FF9CustomMap-world             # deploy
#
# In-game proven 2026-07-09 (the four islands + the seam-free A/B strait at z=-960) and
# 2026-07-11 (island B's minted beach + the lip-anchored cliff walls).

[[placement]]      # A -- the cliff/highland island (the proven (9,5) donor, verbatim)
cell = [0, 12]
donor = [9, 5]
size = [2, 3]

[[placement]]      # B -- the shore/shallow-water island (the proven (10,17) donor), FUSED south of A
cell = [0, 15]
donor = [10, 17]
size = [2, 2]

# THE REAL-SCALE MINTED BEACH (in-game proven 2026-07-11): sink the (10,18) mesa's
# south rim to a sandy-cay profile (the corridor bank -- the falloff runs from the
# beach chord, so the islet's crown keeps its natural cliffs), then mint a 4-column
# beach on the lowered bank. Coords are donor-WORLD coords; each verb's tweak block
# derives from them (here (10,18), the region's south block). Delete both sub-tables
# to get the original all-verbatim island B.
[placement.bank_lower]
center = [674.0, -1168.4]
radius = 7.0
shore_slope = 0.75
cap = 3.6
along = [[666.9, -1168.6], [681.1, -1168.2]]

[placement.virgin_mint]
start = [666.9, -1168.6]
end = [681.1, -1168.2]
width = 3.6
swash = 4.4
pins_from = [7, 17]    # foam/sand language byte-read from the real beach island

[[placement]]      # C -- the real beach island (7,17), standalone, 2-cell buffer from A/B
cell = [3, 18]
donor = [7, 17]
size = [1, 1]
land_margin = 0.0   # required: (7,17)'s land legitimately reaches its own E frame edge (a real hard-cut coast)

[[placement]]      # D -- Uaho (0,0), the all-cliff airship/flying-chocobo-only islet, standalone
cell = [5, 19]
donor = [0, 0]
size = [1, 1]
