# waystation.field.toml -- THE ISLAND WAYSTATION: continent-v1's overworld entrance
# destination (a kit-owned custom field, zero story entanglement).
#
# BG-borrows Daguerreo/Entrance (field 2800, the game's own hidden island harbor) --
# real art + real walkmesh + real camera render engine-side; only OUR .eb ships. A save
# moogle + a savepoint make it a functional rest stop; walking back out the entrance
# door returns to the WORLD MAP via the verbatim shared exit cascade ([[gateway]]
# to = "worldmap"; region key 62 -> wldMapNo 9009, the all-vehicle free-roam superset).
#
# Deploy (from the kit root; the overworld's dedicated folder):
#   py ../tools/deploy_field.py examples/continent-v1/waystation.field.toml --id 6500 \
#       --mod-folder FF9CustomMap-world
# Then wire the overworld trigger + the tower landmark on ISLAND C -- the real beach
# island (7,17), the archipelago's natural landable port with a roomy grass interior.
# (Round-3 lessons: island B's minted cay is too small for a tower + trigger and
# autowarped arrivals -- it stays pure showcase; B's bigger north half is a SEPARATE
# landmass with no beach, unreachable on foot.)
#   py -m ff9mapkit world-entrance --cell 7 36 --field-direct 6500 \
#       --trigger-at 228 -1179 --trigger-radius 3 \
#       --building <the (13,16) tower OBJ> --building-at 228 -1174 \
#       --mod-folder FF9CustomMap-world
# RELAUNCH to apply (a NEW field id registration + world dispatcher .ebs).

[field]
id = 6500
name = "CONT_WAYST"
borrow_bg = "DGLO_MAP775_DG_ENT_0"   # Daguerreo/Entrance (field 2800), area >= 10
area = 55
hide_area_title = true               # the borrowed room's "Daguerreo" card is not this place

[camera]
borrow = "../../.ff9mapkit-cache/fields/2800/camera.bgx"   # build-time guidance (extract-field 2800)
entry_settle = "auto"                # computed hold: the build measures the spawn's warp-in delta
                                     # (-> 50 frames here; was the hand-copied "hub precedent" 45)

[player]
spawn = [0, -2000]                   # just inside the harbor door, on the y=0 corridor

[[npc]]
name = "Mopli"                       # the waystation keeper (white save-moogle rig)
pos = [170, -1750]
model = 220
dialogue = "Kupo! Welcome to the far isles, traveler. Rest here -- you can save your journey just west of me, kupo!"

# the save point: its own press area WEST of the moogle, ON the walkable strip --
# the corridor here is only x in [-207, 207] (measured from 2800's real walkmesh;
# round 3 caught the prop placed off-floor = unreachable). Clear of the NPC's talk
# range (round 1), visibly marked (round 2).
[[prop]]
model = 220                          # the stock standing save moogle (Mopli's rig) --
pos = [-125, -1750]                  # round 4: the save_point archetype is a composite
                                     # with the book-jumping part; the standard is this

[[savepoint]]
zone = [[-190, -1850], [-60, -1850], [-60, -1650], [-190, -1650]]

# walking back out the entrance door returns to the world map -- the zone is field
# 2800's OWN real exit region, verbatim (the borrowed art's door sits exactly there).
# arrive pins the world landing DETERMINISTICALLY at the island tower's foot (the
# engine's position-mirror return is racy for teleported/short visits -- round 3)
[[gateway]]
to = "worldmap"
zone = [[201, -3377], [-193, -3305], [-193, -2315], [188, -2547]]
arrive = [228.0, -1187.0]            # island C, on the beach path -- 8u CLEAR of the
                                     # trigger tiles (THE ARRIVAL-CLEARANCE LAW: an
                                     # arrive point adjacent to a tread trigger makes
                                     # accidental instant re-entry likely; round 5)
arrive_face = 0                      # facing south, away from the tower
