# The full-fidelity completion-journal ENTRY catalog -- SCHEMA.md v1 (studies/completion-journal/).
#
# Two block kinds:
#   [[section]] -- the walkthrough spine: OUR arrangement of the game's own order, SC windows from
#                  the curated anchor table (flags.py SCENARIO_MILESTONES), never hand-invented.
#   [[entry]]   -- one obtainable THING, keyed on the engine predicate that proves the player has it.
#                  Machine-seeded from the treasure_join v2 reward-event atlas
#                  (studies/completion-journal/research/seed_section.py); prose is OURS, original.
#
# Laws + lint: ff9mapkit/journalcatalog.py (the eight SCHEMA laws, each provable-breakable in
# tests/test_journalcatalog.py). Display names for id-keyed rows resolve at RUNTIME ([ITEM=] tag),
# never from text baked here (LAW 5 -- the owner's install stacks Moguri).
#
# Provenance: engine-derived integers (GLOB bit indices, unified item ids, TH points) + our own
# prose. No Square-Enix text, no third-party guide text (PROVENANCE.md; PLAN.md SS5).
#
# AUTHORED SO FAR: d1.prima-vista (30 rows). Every other section is spine-only -- entries land
# section by section with their prose pass; LAW 2 exhaustiveness is scoped to covered rooms.
# Deferred out of d1.prima-vista with reasons:
#   bit 7206 (Alexandria/Wpn. Shop) + bit 7207 (Alexandria/Synthesist) -- those shops are not open
#   in the prologue visit; the events sit in later-visit field variants. They join their own
#   section during the d2/d3 Alexandria prose passes.

