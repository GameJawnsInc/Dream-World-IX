# Display names for FF9's audio files, keyed by FILE STEM (music008, se000032, ...).
#
# The game ships no title table: a sound is only ever an id and a file name. These names are what the
# Workspace's Sounds tab and the Music form's song picker show instead of "music008".
#
# SOURCE: descriptions adapted from the community table in Memoria's
# Assembly-CSharp/Memoria/Assets/Text/AudioResources.cs (Albeoris/Memoria, MIT), with spelling fixed and
# wording trimmed. They are DESCRIPTIONS, not an authoritative track list -- several are a scene the
# piece plays in rather than its title. No game bytes: titles only.
#
# FORMAT: a bare string is the title; an inline table adds search tags --
#     se000012 = { title = "Door opening", tags = ["door"] }
# A name you set in the Sounds tab is written to a per-user overlay (not this file) and wins per sound.
# Most sound effects have no entry here: nobody has named them yet.

