# THE OVERWORLD DONOR CATALOG (audit rec 13) -- READ-ONLY, hand-written.
#
# One [[donor]] per qualified/candidate real-block donor the world pillar carries from.
# `blocks` uses the CLI rect spec ("BX,BY" or "BX0-BX1,BY0-BY1" -- world-mountain --donor).
# `status`: qualified (shipped-verb proven) / candidate (scan output awaiting a human) /
# disqualified. `aperture`: none / object / ensemble (a falls-river MOUTH covered by the
# Object+Falls+River+RiverJoint carry). `alcove` (massifs only): the hand-measured flat
# cave-floor box [x0, x1, z0, z1, y_min] in the donor block's world frame.
#
# The GEOMETRY modules keep their frozen literals (interior.MOUNTAIN_DONOR / UAHO_ALCOVE,
# island.BEACH_PINS, transplant.PROVEN_DONOR, ...) -- the Uaho carry's bit-frozen acceptance
# must NOT acquire a file-parse dependency. tests/test_world_donors.py's DRIFT test pins
# every one of those literals to a row here, which is what keeps this table from becoming a
# fifth stale copy. New scan output (donor_qualify_scan.py, studies/) enters as
# status = "candidate" rows a human promotes; there is deliberately no --regen.

[[donor]]
name = "uaho"
blocks = "0,0"
class = "massif"
aperture = "object"
alcove = [31.0, 40.5, -38.5, -30.5, 4.5]
status = "qualified"
anatomy_study = "studies/overworld-topography/README.md (massif_carry.py + the aperture-plug anatomy)"
note = "world-mountain's default --donor; the ONLY donor with a full anatomy study. The alcove floor is hand-measured (interior.UAHO_ALCOVE) -- a new donor needs its own box or none."

[[donor]]
name = "crag"
blocks = "10,5-6"
class = "massif"
aperture = "none"
status = "qualified"
anatomy_study = "studies/overworld-topography/crag_anatomy.py -> out/crag_anatomy.json"
note = "QUALIFIED AS A RECT: the massif straddles the block border, so the target sizes itself to a multi-block span. The study README's DISQUALIFIED verdict applied to SINGLE-BLOCK v1 only, and that restriction ended with the rect carry -- this row resolves the README:376-vs-:423 contradiction."

