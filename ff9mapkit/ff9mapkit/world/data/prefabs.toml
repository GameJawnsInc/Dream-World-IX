# Landmass PREFABS (studies/overworld-editor/PREFABS.md, rung P1) -- read by ff9mapkit/world/prefab.py.
#
# A prefab is a world-fuse recipe written RELATIVE to an anchor block: one [[island]] mint (first, with its seed)
# plus carried relief ([[mountain]] / [[forest]] / [[hill]]). Every `center = [dx, dz]` is an offset from the anchor
# block's frame origin -- its corner at the lowest x and z, (64*bx, -64*(by+1)). Placement shifts the rows by whole
# blocks and turns the prefab frame on for the island and the mountain; never write prefab_frame, step or near here.
#
# `fingerprint` + `footprint` are taken by the tool, never typed:  ff9mapkit world-prefab NAME --fingerprint --cell BX,BY
# A placement refuses unless the staged land matches them, so a fingerprint names the bytes that were walked.
# The sea's navigation classes are MASKED in it (they depend on stock land within 16u of the site -- THE NAV
# MARGIN); placement checks them against the coast-nav stamp at each site instead.
#
# status: "candidate" until the owner walks it in game (rim, every carry), then "qualified" with the walk noted.
# Each prefab is a composition the verbs' own gates passed whole; the walk, not the gates, is the verdict
# (A GREEN GATE SUITE IS A REGRESSION HARNESS, NOT AN ORACLE).

