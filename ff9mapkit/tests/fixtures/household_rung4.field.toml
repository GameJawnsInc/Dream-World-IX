# THE HOUSEHOLD DAY -- sims-arc bench, urge tier "rung4", rates "tuned" (generated by studies/sims/sims_bench2.py)
# Five needs, five objects, priority-branch autonomy, the day clock. Novel field, stock Memoria.

[field]
id = 30433
name = "MANOR4"
area = 11
title = "mognet manor"

[camera]
entry_settle = "auto"
pitch = 48.0
distance = 4500
fov = 42.2
[camera.frame]
back = 205
front = 432

[walkmesh]
quad = [[-1220, 257], [1220, 257], [1220, -1931], [-1220, -1931]]
frame = "world"

[[layers]]
image = "art/back.png"
z = 4000
[[layers]]
image = "art/floor.png"
z = 3000

[player]
spawn = [0, -1700]

[[npc]]
name = "bilba"
model = "GEO_MAIN_F0_VIV"
pos = [-200, -700]
dialogue = "...The soup is still worried. So am I, a little."

[[marker]]
name = "home"
pos = [-200, -700]


[[prop]]
prop = "pot"
pos = [600, -250]

[[marker]]
name = "hunger_spot"
pos = [600, -520]

[[prop]]
prop = "cup"
pos = [-950, -1100]

[[marker]]
name = "thirst_spot"
pos = [-720, -1100]

[[prop]]
prop = "tent"
pos = [-850, -150]

[[marker]]
name = "energy_spot"
pos = [-850, -500]

[[prop]]
prop = "cask"
pos = [950, -1050]

[[marker]]
name = "hygiene_spot"
pos = [720, -1050]

[[prop]]
prop = "dagger_doll"
pos = [100, -150]

[[marker]]
name = "fun_spot"
pos = [100, -420]

# ---------------------------------------------------------------- the behavior
[behavior]
warmup = 30
public_flags = ["t_hunger", "t_thirst", "t_energy", "t_hygiene", "t_fun", "nosleep"]
alternators = [{ name = "night", frames = 1800 }, { name = "beat", frames = 75 }]


[[behavior.table]]
name = "need"                       # 0=hunger, 1=thirst, 2=energy, 3=hygiene, 4=fun (0..100, 100 = met)
values = [80, 70, 75, 85, 60]
id = 1000

[[behavior.table]]
name = "clock"                      # [0] = hours since entry (the day starts at 06:00)
values = [0]
id = 1001


[[behavior.drift]]                  # THE CLOCK
table = "clock"
index = 0
by = 1
clamp = [0, 1000000]
every = 150

[[behavior.drift]]                  # metabolism: hunger
table = "need"
index = 0
by = -1
clamp = [0, 100]
every = 45

[[behavior.drift]]                  # metabolism: thirst
table = "need"
index = 1
by = -1
clamp = [0, 100]
every = 40

[[behavior.drift]]                  # metabolism: energy
table = "need"
index = 2
by = -1
clamp = [0, 100]
every = 55

[[behavior.drift]]                  # metabolism: hygiene
table = "need"
index = 3
by = -1
clamp = [0, 100]
every = 60

[[behavior.drift]]                  # metabolism: fun
table = "need"
index = 4
by = -1
clamp = [0, 100]
every = 45

[[behavior.drift]]                  # night tires her faster
table = "need"
index = 2
by = -1
clamp = [0, 100]
every = 40
flag = "night"

[[behavior.drift]]                  # rung 4: an all-nighter drains her fast
table = "need"
index = 2
by = -1
clamp = [0, 100]
every = 5
flag = "nosleep"

[[behavior.hud]]                    # ONE strip: gMesValue[8] is global, a second strip overwrites this one's slots
window = 6
text = "[MPOS=10,48]HUN [NUMB=0] THR [NUMB=1] NRG [NUMB=2] HYG [NUMB=3] FUN [NUMB=4]\nDAY [NUMB=5]  [NUMB=6]:00  MOOD [NUMB=7]"
values = ["expr:const(1000) const(0) B_VECTOR", "expr:const(1000) const(1) B_VECTOR", "expr:const(1000) const(2) B_VECTOR", "expr:const(1000) const(3) B_VECTOR", "expr:const(1000) const(4) B_VECTOR",
          "expr:const(1001) const(0) B_VECTOR const(6) B_PLUS const(24) B_DIV const(1) B_PLUS",
          "expr:const(1001) const(0) B_VECTOR const(6) B_PLUS const(24) B_REM",
          "expr:const(1000) const(0) B_VECTOR const(1000) const(1) B_VECTOR B_PLUS const(1000) const(2) B_VECTOR B_PLUS const(1000) const(3) B_VECTOR B_PLUS const(1000) const(4) B_VECTOR B_PLUS const(5) B_DIV"]
digits = [3, 3, 3, 3, 3, 2, 2, 3]
# (no "(day)/(night)" word: a [TEXT=] in a HUD strip is resolved ONCE at window open -- the engine's constant-tag
#  pass runs before the variable snapshot -- so it freezes at the open pass's sentinel row and renders "")

[[behavior.unit]]
npc = "bilba"
speed = 25

  [[behavior.unit.branch]]           # the all-nighter: up out of bed, now
  when = [{ flag = "nosleep" }, { flag = "t_energy" }]
  do = { hold_ground = true }
  clear_flags = ["t_energy"]

  [[behavior.unit.branch]]           # FAINT hunger: back on her feet
  when = [{ flag = "f_hunger" }, { table_ge = ["need", 0, 25] }]
  do = { hold_ground = true }
  clear_flags = ["f_hunger"]

  [[behavior.unit.branch]]           # FAINT hunger: down, frozen, the need creeping back
  when = [{ flag = "f_hunger" }]
  do = { hold_ground = true, anim = "hiza_1", freeze = true }
  adjust = { table = "need", index = 0, by = 1, clamp = [0, 100], every = 10 }

  [[behavior.unit.branch]]           # FAINT hunger: the need hit 0 -- she drops where she stands
  when = [{ table_le = ["need", 0, 0] }]
  do = { hold_ground = true }
  raise_flags = ["f_hunger"]

  [[behavior.unit.branch]]           # FAINT thirst: back on her feet
  when = [{ flag = "f_thirst" }, { table_ge = ["need", 1, 25] }]
  do = { hold_ground = true }
  clear_flags = ["f_thirst"]

  [[behavior.unit.branch]]           # FAINT thirst: down, frozen, the need creeping back
  when = [{ flag = "f_thirst" }]
  do = { hold_ground = true, anim = "hiza_1", freeze = true }
  adjust = { table = "need", index = 1, by = 1, clamp = [0, 100], every = 10 }

  [[behavior.unit.branch]]           # FAINT thirst: the need hit 0 -- she drops where she stands
  when = [{ table_le = ["need", 1, 0] }]
  do = { hold_ground = true }
  raise_flags = ["f_thirst"]

  [[behavior.unit.branch]]           # FAINT energy: back on her feet
  when = [{ flag = "f_energy" }, { table_ge = ["need", 2, 25] }]
  do = { hold_ground = true }
  clear_flags = ["f_energy"]

  [[behavior.unit.branch]]           # FAINT energy: down, frozen, the need creeping back
  when = [{ flag = "f_energy" }]
  do = { hold_ground = true, anim = "hiza_1", freeze = true }
  adjust = { table = "need", index = 2, by = 1, clamp = [0, 100], every = 10 }

  [[behavior.unit.branch]]           # FAINT energy: the need hit 0 -- she drops where she stands
  when = [{ table_le = ["need", 2, 0] }]
  do = { hold_ground = true }
  raise_flags = ["f_energy"]
  clear_flags = ["nosleep"]

  [[behavior.unit.branch]]           # FAINT hygiene: back on her feet
  when = [{ flag = "f_hygiene" }, { table_ge = ["need", 3, 25] }]
  do = { hold_ground = true }
  clear_flags = ["f_hygiene"]

  [[behavior.unit.branch]]           # FAINT hygiene: down, frozen, the need creeping back
  when = [{ flag = "f_hygiene" }]
  do = { hold_ground = true, anim = "hiza_1", freeze = true }
  adjust = { table = "need", index = 3, by = 1, clamp = [0, 100], every = 10 }

  [[behavior.unit.branch]]           # FAINT hygiene: the need hit 0 -- she drops where she stands
  when = [{ table_le = ["need", 3, 0] }]
  do = { hold_ground = true }
  raise_flags = ["f_hygiene"]

  [[behavior.unit.branch]]           # FAINT fun: back on her feet
  when = [{ flag = "f_fun" }, { table_ge = ["need", 4, 25] }]
  do = { hold_ground = true }
  clear_flags = ["f_fun"]

  [[behavior.unit.branch]]           # FAINT fun: down, frozen, the need creeping back
  when = [{ flag = "f_fun" }]
  do = { hold_ground = true, anim = "hiza_1", freeze = true }
  adjust = { table = "need", index = 4, by = 1, clamp = [0, 100], every = 10 }

  [[behavior.unit.branch]]           # FAINT fun: the need hit 0 -- she drops where she stands
  when = [{ table_le = ["need", 4, 0] }]
  do = { hold_ground = true }
  raise_flags = ["f_fun"]

  [[behavior.unit.branch]]           # finish: hunger is met -> the task retires
  when = [{ flag = "t_hunger" }, { table_ge = ["need", 0, 95] }]
  do = { hold = "hunger_spot" }
  clear_flags = ["t_hunger"]

  [[behavior.unit.branch]]           # finish: thirst is met -> the task retires
  when = [{ flag = "t_thirst" }, { table_ge = ["need", 1, 95] }]
  do = { hold = "thirst_spot" }
  clear_flags = ["t_thirst"]

  [[behavior.unit.branch]]           # finish: energy is met -> the task retires
  when = [{ flag = "t_energy" }, { table_ge = ["need", 2, 95] }]
  do = { hold = "energy_spot" }
  clear_flags = ["t_energy"]

  [[behavior.unit.branch]]           # finish: hygiene is met -> the task retires
  when = [{ flag = "t_hygiene" }, { table_ge = ["need", 3, 95] }]
  do = { hold = "hygiene_spot" }
  clear_flags = ["t_hygiene"]

  [[behavior.unit.branch]]           # finish: fun is met -> the task retires
  when = [{ flag = "t_fun" }, { table_ge = ["need", 4, 95] }]
  do = { hold = "fun_spot" }
  clear_flags = ["t_fun"]

  [[behavior.unit.branch]]           # use: at the hunger object, the meter climbs
  when = [{ flag = "t_hunger" }, { near_point = ["hunger_spot", 160] }]
  do = { hold_ground = true, anim = "dine_1" }
  adjust = { table = "need", index = 0, by = 2, clamp = [0, 100], every = 8 }

  [[behavior.unit.branch]]           # use: at the thirst object, the meter climbs
  when = [{ flag = "t_thirst" }, { near_point = ["thirst_spot", 160] }]
  do = { hold = "thirst_spot" }
  adjust = { table = "need", index = 1, by = 3, clamp = [0, 100], every = 8 }

  [[behavior.unit.branch]]           # use: at the energy object, the meter climbs
  when = [{ flag = "t_energy" }, { near_point = ["energy_spot", 160] }]
  do = { hold_ground = true, anim = "sleeping" }
  adjust = { table = "need", index = 2, by = 1, clamp = [0, 100], every = 6 }

  [[behavior.unit.branch]]           # use: at the hygiene object, the meter climbs
  when = [{ flag = "t_hygiene" }, { near_point = ["hygiene_spot", 160] }]
  do = { hold = "hygiene_spot" }
  adjust = { table = "need", index = 3, by = 2, clamp = [0, 100], every = 8 }

  [[behavior.unit.branch]]           # use: at the fun object, the meter climbs
  when = [{ flag = "t_fun" }, { near_point = ["fun_spot", 160] }]
  do = { hold_ground = true, anim = "laugh" }
  adjust = { table = "need", index = 4, by = 2, clamp = [0, 100], every = 10 }

  [[behavior.unit.branch]]           # go: a hunger task is waiting
  when = [{ flag = "t_hunger" }]
  do = { walk_to = "hunger_spot", speed = 40 }

  [[behavior.unit.branch]]           # go: a thirst task is waiting
  when = [{ flag = "t_thirst" }]
  do = { walk_to = "thirst_spot", speed = 40 }

  [[behavior.unit.branch]]           # go: a energy task is waiting
  when = [{ flag = "t_energy" }]
  do = { walk_to = "energy_spot", speed = 40 }

  [[behavior.unit.branch]]           # go: a hygiene task is waiting
  when = [{ flag = "t_hygiene" }]
  do = { walk_to = "hygiene_spot", speed = 40 }

  [[behavior.unit.branch]]           # go: a fun task is waiting
  when = [{ flag = "t_fun" }]
  do = { walk_to = "fun_spot", speed = 40 }

  [[behavior.unit.branch]]           # urge: night, and tired enough to turn in
  when = [{ flag = "night" }, { table_le = ["need", 2, 70] }, { not_flag = "nosleep" }]
  do = { walk_to = "energy_spot", speed = 40 }
  raise_flags = ["t_energy"]

  [[behavior.unit.branch]]           # urge: hunger has run low
  when = [{ table_le = ["need", 0, 40] }]
  do = { walk_to = "hunger_spot", speed = 40 }
  raise_flags = ["t_hunger"]

  [[behavior.unit.branch]]           # urge: thirst has run low
  when = [{ table_le = ["need", 1, 40] }]
  do = { walk_to = "thirst_spot", speed = 40 }
  raise_flags = ["t_thirst"]

  [[behavior.unit.branch]]           # urge: energy has run low
  when = [{ table_le = ["need", 2, 40] }, { not_flag = "nosleep" }]
  do = { walk_to = "energy_spot", speed = 40 }
  raise_flags = ["t_energy"]

  [[behavior.unit.branch]]           # urge: hygiene has run low
  when = [{ table_le = ["need", 3, 40] }]
  do = { walk_to = "hygiene_spot", speed = 40 }
  raise_flags = ["t_hygiene"]

  [[behavior.unit.branch]]           # urge: fun has run low
  when = [{ table_le = ["need", 4, 40] }]
  do = { walk_to = "fun_spot", speed = 40 }
  raise_flags = ["t_fun"]

  [[behavior.unit.branch]]           # idle emote: tired -> a yawn on the beat
  when = [{ flag = "beat" }, { table_le = ["need", 2, 55] }]
  do = { hold_ground = true, anim = "yawn" }

  [[behavior.unit.branch]]           # idle emote: merry -> a laugh on the beat
  when = [{ flag = "beat" }, { table_ge = ["need", 4, 80] }]
  do = { hold_ground = true, anim = "laugh" }

  # idle: amble round home
  [[behavior.unit.branch]]
  do = { wander = "home", radius = 200, every = 120, speed = 25 }

# ---------------------------------------------------------------- the directives
# One zone menu per object on its steward-side flank (press-action + the "!" bubble). The order row hides
# while that task is already pending (requires_flag_clear on the SAME public flag). No reply page: rung 1
# found the order lands when the reply CLOSES, so a reply only delays the walk.
[[choice]]
zone = [[340, -490], [860, -490], [860, -10], [340, -10]]
bubble = true
instant = true
prompt = "The soup pot."
[[choice.options]]
text = "Bilba, eat something."
set_flag = [14867, 1]
requires_flag_clear = 14867
[[choice.options]]
