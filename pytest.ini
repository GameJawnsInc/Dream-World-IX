[pytest]
# The real suite lives under ff9mapkit/ (tests/ + blender/tests/, gated by ff9mapkit/conftest.py) plus
# docsite/tests/ (the manual generator; hermetic, needs the `markdown` dep from the [dev] extra).
# NOTE: pytest honours testpaths ONLY when invoked from this rootdir with no args -- the nightly gate
# and CI run from ff9mapkit/, so they pass both trees explicitly (tools/nightly_gate.py, release.yml).
# Without this, pytest's default *_test.py glob also collects tools/*_test.py -- those are standalone
# dev/demo scripts (sys.argv-driven, module-level side-effecting code writing into the gitignored
# tools/scroll_out/ scratch dir), not real tests, and they error at collection time.
testpaths = ff9mapkit docsite
