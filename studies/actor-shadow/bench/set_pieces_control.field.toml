# CONTROL for the set-pieces bench (30921): the SAME bench as set_pieces.field.toml with shadow = false on every set piece --
# exactly the bytes those set pieces built to before the set-piece change (the player + the holder NPC keep
# their rung-0 census shadows in BOTH builds, so they are an in-pair "unchanged" control). Deploy it to the
# same slot and shoot it at the same moments; measure_shadows.py --bench set_pieces compares the two frames.
#
#   py tools/deploy_field.py studies/actor-shadow/bench/set_pieces_control.field.toml --id 30921 --name SHD1 --text-block 30921

