# =====================================================================================
# COMPLETION-JOURNAL T1b -- LAYOUT BENCH  --  field 30801
# =====================================================================================
# GENERATED by `ff9mapkit.journalfield.bench_toml()` from the ONE row catalog
# (ff9mapkit/ff9mapkit/journal.py). DO NOT HAND-EDIT: tests/test_journalfield.py asserts this
# file equals the generator's output byte for byte, so a hand edit fails the suite.
#
# WHAT THIS BENCH IS, AND WHAT IT IS NOT.
#   IS:     the seven real dashboard pages, verbatim, at their real widths and line counts,
#           in a real modal field window. It answers the three questions the offline suite
#           CANNOT: (a) does a ~26-unit line render unwrapped, (b) does an 11-line window sit
#           inside kLimitTop/kLimitBottom at the owner's aspect ratio, (c) does the '--' vs
#           'n/a' distinction read as informative or as broken.
#   IS NOT: the live dashboard. EVERY [NUMB=] READS 0 HERE, on purpose. field.toml has no lane
#           that carries a raw talk-handler body ([[logic_add]] needs [verbatim_eb],
#           build.py:930-934; [behavior] is refused on a verbatim fork), so the value writes
#           this module generates -- `journalfield.talk_body`, 3114 reviewable bytes, decode
#           them with `py -m ff9mapkit journal eb` -- cannot be attached from a TOML yet. That
#           seam is one build.py change and it is the next rung, not this one.
#           The value reads themselves are ALREADY owner-confirmed in-game (rung 0, bench
#           30800): Null.SBit[5], Global.UInt16/Byte/Bit, const(n) B_HAVE_ITEM, flex(), and
#           composed B_DIV/B_GE/B_MULT arithmetic all read correct per-save values.
#
# The two [TEXT=bank,slot] rows show their WIDEST table string instead of the tag: the bank is
# a txid the build assigns by POSITION (build.py:7795-7834) and is not authorable. The widest
# row is the honest worst case for a width test.
#
# DEPLOY (the HUMAN does this -- the agent does not):
#   py tools/deploy_field.py studies/completion-journal/bench/journal_dash.field.toml --id 30801
# FIRST deploy of 30801 needs a RELAUNCH (it registers a DictionaryPatch line); after
# that, `~` -> Reload field. Re-read the live registrations first -- EventDB/SceneData are
# GLOBAL across stacked mod folders and a collision is the null-.eb black screen.

[field]
id = 30801          # dev-scratch band (30000-32767; fldMapNo is Int16, max 32767)
name = "JOURNALDASH"
area = 11               # must be >= 10 (BG area 0-9 black-screens)
title = "JOURNAL DASH"
# text_block deliberately UNSET: the kit derives it from the field id and auto-registers it.
# Pinning a real block would overwrite that location's dialogue -- the mesID namespace is ONE
# FLAT GLOBAL space shared with the base game.

# --- scene: the same flat bench room the rung-0 probe used ---------------------------------
[camera]
pitch = 48.0
distance = 4500
fov = 42.2
[camera.frame]
back = 205
front = 432

[walkmesh]
quad = [[-1220, 257], [1220, 257], [1220, -1931], [-1220, -1931]]
frame = "world"

[[layers]]
image = "art/back.png"   # PLACEHOLDER (solid slate) -- a bench needs no real art
z = 4000
[[layers]]
image = "art/floor.png"  # PLACEHOLDER (perspective checkerboard)
z = 3000

[player]
spawn = [0, -837]

# --- the lectern-tender: talk -> menu -> one page ------------------------------------------
# An NPC, not a walk-in zone: a `once=false` tread re-fires while the player stands in it
# (feedback-bench-visible-landmarks). 400u from the spawn -- actors jam under ~192u.
[[npc]]
name = "keeper"
model = "GEO_NPC_F0_CSO"
pos = [400, -837]

# --- the dummy behavior unit ---------------------------------------------------------------
# content/behaviortoml.py table() is `return b if isinstance(b, dict) and b.get("unit") else
# None` (:147-150), so a [behavior] block carrying only a hud compiles to NOTHING, SILENTLY,
# and validate() still returns []. The unit row below is what makes the block compile at all.
# NOTE FOR THE NEXT RUNG: the dashboard itself needs NO [behavior] block -- it rides the
# [[choice]] lane -- which is one fewer way to fail. The block is here because this bench is
# also where that trap is kept live and visible.
[[npc]]
name = "scribe"
model = "GEO_NPC_F0_CSO"
pos = [-400, -837]

[behavior]
warmup = 30

  [[behavior.unit]]
  npc = "scribe"
    [[behavior.unit.branch]]
    do = { hold = [-400, -837] }   # stand still; the unit row is a compile gate

# --- THE MENU + THE SEVEN PAGES ------------------------------------------------------------
# `Close` is LAST: with no [PCHC]/[PCHM] the engine's CANCEL row is the last one
# (content/choice.py:20-21), so pressing B must close the journal, not open the last page.
[[choice]]
npc = "keeper"
instant = true          # [IMME] -- a selector pops fully drawn (FF9's own shop/menu convention)
prompt = """
Which page? (LAYOUT BENCH:
every number reads 0)"""

  [[choice.options]]
  text = "Story & treasure"
  reply = """
[IMME]== STORY & TREASURE 
Scenario                 [NUMB=0]
T.Hunter pts            [NUMB=1]
T.Hunter rank          H
Chests opened         n/a"""
  instant = true

  [[choice.options]]
  text = "Chocobo"
  reply = """
[IMME]== CHOCOBO ==========
Chocographs           [NUMB=0]/24
..dug up                   [NUMB=1]/24
Beak level               [NUMB=2]/99
Dig terrain               [NUMB=3]/5
Beaches                  [NUMB=4]/21"""
  instant = true

  [[choice.options]]
  text = "Minigames"
  reply = """
[IMME]== MINIGAMES ==========
Stellazzio               [NUMB=0]/13
Ragtime                  [NUMB=1]/16
Treno coins             [NUMB=2]/51
Frogs                      [NUMB=3]/99
Hunt winner            Zidane"""
  instant = true

  [[choice.options]]
  text = "Tetra Master"
  reply = """
[IMME]== TETRA MASTER ======
Cards held               [NUMB=0]
Card kinds               [NUMB=1]/100
Coll. points              [NUMB=2]
Coll. level                [NUMB=3]
