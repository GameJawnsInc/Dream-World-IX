rows = ["H", "G", "F", "E", "D", "C", "B", "A", "S"]

[[text_table]]
name = "hunt"
rows = ["---", "Zidane", "Vivi", "Freya"]

[[text_table]]
name = "marks"
rows = ["--", "OK"]

[[text_table]]
