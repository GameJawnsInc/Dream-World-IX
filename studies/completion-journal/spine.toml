# The walkthrough spine -- SCHEMA.md's [[section]] layer, draft 1.
#
# Main-path sections come 1:1 from the kit's curated 52-anchor table
# (ff9mapkit/flags.py SCENARIO_MILESTONES -- in-game-validated at SC 7200), with
# same-place consecutive anchors merged. `sc.leave` = the NEXT section's enter
# (SC is the game's own linear clock; Q2b proved every write is an absolute
# literal, so these windows cannot be invalidated by a delta).
# Side sections (side = true) are re-visitable content: `sc.enter` = first
# availability, `sc.leave = 0` = never closes (0 is the open sentinel).
# `areas` (manifest area ids) are filled by the generator pass, not by hand.
#
# DISC BOUNDARIES are walkthrough structure only -- nothing in the save encodes
# the disc; they anchor section grouping in the UI.

