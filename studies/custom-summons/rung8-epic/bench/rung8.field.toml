# --- THE SUMMON --------------------------------------------------------------------------------------
# THE BLOCK IS VALIDATED BY `build`/`lint` AND EMITTED BY `summon-deploy` -- two separate steps, by design
# (m2/DESIGN.md section 2.4). `build` never writes a byte of SpecialEffects/; it only refuses a block that
# would not deploy. `bench/build_rung8_bench.py` runs both halves offline into ../stage/final/.
#
# Paths are relative to THIS FILE's directory (content/summon.py:_path_problems), and they deliberately
# reach into the sibling LANES that own each artifact:
#   ../creature/nimbra/  the creature lane (make_nimbra.py / make_nimbra_anims.py)
#   ../nimbra.seq        the sequence lane
#   ../*.sfxmodel        the particle lane
# Nothing is copied into bench/ -- each lane stays the single source of truth for its own bytes.
[[summon]]
lane       = "overlay"                     # DLL-free; runs on STOCK Memoria (no s58, no [SfxHybrid])
model      = "../creature/nimbra/6400.fbx"
id         = 6400
name       = "GEO_MON_B0_M400"
group      = "MON"
private_ef = 91                            # PINNED (STORYBOARD 6.1). 84 is the live Thomas/M1b bench and
                                           # must stay bit-intact; auto-alloc walks the absent pool
                                           # ASCENDING and would land on 18 ("would apply effect
                                           # instantly") -- not what a 32-second cast wants.
sequence   = "../nimbra.seq"               # K1 -- an AUTHORED cast. No `donor`: nothing stock is read,
                                           # spliced or drift-guarded anywhere in this block.
manifest   = "nimbra_manifest.sfxmodel"    # the bare name FileList.txt reveals (single-space grammar)
clips      = ["../creature/nimbra/emerge.anim",     # K2 -- NAMED clips, so deploy.clip_key_of mints the
              "../creature/nimbra/drift.anim",      # 60000/60001/60002 band keys and clip_name_map
              "../creature/nimbra/strike.anim"]     # resolves `play.clip = "emerge"` onto them.
particles  = ["../MistFloor.sfxmodel",              # K3 -- copied verbatim into ef091/ beside the
              "../MistWisps.sfxmodel",              # manifest, which is where CreateVisualEffect's full
              "../RiftFlash.sfxmodel"]              # Data/-rooted SFXModel= path points.

# --- K4: the staging curves (STORYBOARD 3.3) --------------------------------------------------------
# anchor = "target_average" is LOAD-BEARING. THE MULTI-TARGET NULL: SFXData.cs:149 passes a NULL target
# into SetupPositions whenever the cast has >1 target, so every TargetPosition* would evaluate to 0 and
# NIMBRA would render at the world origin (THE MOVEMENT TRAP by a second route). TargetAveragePosition*
# is BTL_VFX_REQ.trgcpos -- always valid -- and its vy is hard-zero (BTL_VFX_REQ.cs:88), so the Y offsets
# below are ABSOLUTE ground-plane heights, not heights above the enemy line.
[summon.staging]
anchor = "target_average"
start  = 0
end    = 330            # PINNED, not auto-derived: ../nimbra.seq's WaitSFXDone beat is authored against
                        # it (PlaySFX at tick 150 + 330 = the instance drains at 480).

# Movement: rise from below the frame, then a barely-there continued lift through the whole hang.
[[summon.staging.move]]
duration = 45
from = [0, -900, 0]
to   = [0,  120, 0]
ease = ["Linear", "SinusOut", "Linear"]
[[summon.staging.move]]
duration = 285          # `from` omitted -> the engine inherits the previous piece's Destination BY
to   = [0, 190, 0]      # EXPRESSION REFERENCE (ParametricMovement.cs:88-105). Re-emitting it would
ease = ["Linear", "Sinus", "Linear"]      # double-evaluate the NCalc.

# Rotation: ABSOLUTE euler, applied raw to eulerAngles with no battle-actor base (SFXDataMesh.cs:844) --
# THE ROTATION BASELINE LAW. (0,180,180) is rung 7's proven facing.
# THE ONE KNOB THAT MAY COST A CAST (R4): NIMBRA stands enemy-side, the mirror of rung 7's caster-side
# staging. If cast 1 shows it facing away, flip every Y between 180 and 0 (and 168 -> 12): one line,
# recast-only, no re-export, no relaunch.
[[summon.staging.turn]]
duration = 45
from = [0, 180, 180]
to   = [0, 180, 180]
[[summon.staging.turn]]
duration = 180
to   = [0, 168, 180]
ease = ["Constant", "Sinus", "Constant"]
[[summon.staging.turn]]
duration = 105
to   = [0, 180, 180]
ease = ["Constant", "SinusOut", "Constant"]

# Scaling: the approach (an approach WITHOUT a camera move -- STORYBOARD 2.4 lever 3), the hold, then THE
# DISSOLVE: the body thins to a thread while stretching upward, which reads as vapour venting.
[[summon.staging.scale]]
duration = 45
from = [0.15, 0.15, 0.15]
to   = [1.0, 1.0, 1.0]
ease = ["SinusOut", "SinusOut", "SinusOut"]
[[summon.staging.scale]]
duration = 210
to   = [1.0, 1.0, 1.0]
ease = ["Constant", "Constant", "Constant"]
[[summon.staging.scale]]
duration = 75
to   = [0.02, 1.70, 0.02]
ease = ["SinusIn", "SinusOut", "SinusIn"]

# The playlist. THE ANIMATION-PLAYLIST LAW: entries chain each clip ONCE and then FREEZE -- there is no
# loop flag and no blending, so `repeat` expands to N identical entries and every clip must open and close
# on the shared `drift` rest pose. `speed` is a DIVISOR of the frame count (animMaxFrame = ceil(frames /
# speed), SFXDataMesh.cs:852), so at BattleTPS=15 a 30fps clip plays at HALF speed with speed = 1:
# speed 2 restores authored tempo (emerge/strike), speed 1 is the deliberate eerie half-speed (drift).
# Total 45 + 75 + 75 + 30 + 75 + 75 = 375 ticks >= the 330-tick window, so it never freezes on a last frame.
[[summon.staging.play]]
clip = "emerge"
speed = 2
[[summon.staging.play]]
clip = "drift"
speed = 1
repeat = 2
[[summon.staging.play]]
clip = "strike"
speed = 2
[[summon.staging.play]]
clip = "drift"
speed = 1
repeat = 2

# --- random battles, so NIMBRA has something to be cast at (build auto-adds the after-battle reinit) --
[encounter]
scene = 67                 # Evil Forest / Trail -- the game's first, weakest battles. MULTIPLE enemies is
                           # the point: AllEnemy + >1 target is exactly the case THE MULTI-TARGET NULL
                           # would have broken, so a multi-enemy formation is the real test.
freq = 48
battle_music = 0

[music]
song = 9

# --- a save point: the cast costs MP, and a moogle tent is the cheapest way to run cast N+1 -----------
[[savepoint]]
zone = [[-220, -420], [220, -420], [220, -720], [-220, -720]]
