# --- THE SUMMON --------------------------------------------------------------------------------------
# THE BLOCK IS VALIDATED BY `build`/`lint` AND EMITTED BY `summon-deploy` -- two separate steps, by design
# (m2/DESIGN.md section 2.4). `build` never writes a byte of SpecialEffects/; it only refuses a block that
# would not deploy. `bench/build_rung8_bench.py` runs both halves offline into ../stage/final/.
#
# Paths are relative to THIS FILE's directory (content/summon.py:_path_problems), and they deliberately
# reach into the sibling LANES that own each artifact:
#   ../creature/nimbra/  the creature lane (make_nimbra.py / make_nimbra_anims.py)
#   ../nimbra.seq        the sequence lane
#   ../*.sfxmodel        the particle lane
# Nothing is copied into bench/ -- each lane stays the single source of truth for its own bytes.
[[summon]]
# THE PAIR (2026-07-24, the short/full roll round). ONE block now stages BOTH casts:
#   primary  = THE FULL     ef080, ../nimbra_full.seq, 23.0s -- FULL-STORYBOARD sections 3/4; the ability's
#                           vfx1. ef080 is STORYBOARD 6.1's reserved spare ("the spare", verified absent
#                           from stock); nimbra_full.seq already writes SFX=80 on every LoadSFX/PlaySFX.
#   short    = THE WHISPER  ef091, ../nimbra.seq, 9.3s -- the approved CAST 2, BYTE-IDENTICAL re-emit
#                           (seq verbatim bytes, same manifest name, same K4 curves); the ability's vfx2.
#   the roll = an AbilityFeatures Command-trigger (>SA Global) keyed CommandId 46 AND AbilityId 195 --
#              ability-discriminated because command 46 hosts FOUR abilities and a command-wide roll
#              would flip the other three onto Vfx2 at 2/3 damage. Stock odds (230/170 of 256), stock
#              primitive (GetRandom() = Comn.random8()), threshold MP > 24 = post-deduction compensation
#              (btl_cmd.cs:1652 deducts at INSPECTION; post > cost <=> stock's pre > 2*cost).
lane       = "overlay"                     # DLL-free; runs on STOCK Memoria (no s58, no [SfxHybrid])
model      = "../creature/nimbra/6400.fbx"
id         = 6400
name       = "GEO_MON_B0_M400"
group      = "MON"
private_ef = 80                            # THE FULL's own folder (STORYBOARD 6.1's spare). 84 is the
                                           # live Thomas/M1b bench and must stay bit-intact; 91 is the
                                           # short's (below).
sequence   = "../nimbra_full.seq"          # K1 -- an AUTHORED cast. No `donor`: nothing stock is read,
                                           # spliced or drift-guarded anywhere in this block.
manifest   = "nimbra_full_manifest.sfxmodel"   # the bare name ef080/FileList.txt reveals (FULL-STORYBOARD 7.2)
clips      = ["../creature/nimbra/emerge.anim",     # K2 -- NAMED clips, so deploy.clip_key_of mints the
              "../creature/nimbra/drift.anim",      # 60000..60003 band keys and clip_name_map resolves
              "../creature/nimbra/strike.anim",     # `play.clip = "emerge"` onto them. ORDER IS
              "../creature/nimbra/driftlook.anim"]  # LOAD-BEARING: the key is 60000 + list index, BOTH
                                                    # manifests drive the same GEO 6400, and the deployed
                                                    # short was keyed on THIS order -- never reorder
                                                    # (FULL-STORYBOARD 7.2).
particles  = ["../MistFloor.sfxmodel",              # K3 -- copied verbatim into ef080/ AND ef091/ (each
              "../MistWisps.sfxmodel",              # folder is self-contained), which is where
              "../RiftFlash.sfxmodel"]              # CreateVisualEffect's Data/-rooted SFXModel= points.

# --- the SHORT half + the roll trio ------------------------------------------------------------------
short_sequence   = "../nimbra.seq"              # the approved WHISPER, staged verbatim-bytes
short_private_ef = 91                           # PINNED: the folder the live install already runs; the
                                                # re-emit must be byte-identical (deploy gate D2 below)
short_manifest   = "nimbra_manifest.sfxmodel"   # PINNED: ef091/FileList.txt's deployed name -- byte-identity
roll_mp      = 24                               # the Nimbra ability's OWN mp (the row above)
roll_command = 46                               # Iviv's minted command1 (Spark) -- build_rung8_bench asserts it
roll_ability = 195                              # Nimbra's minted ability id -- THE DISCRIMINATOR (see header)

# --- K4: THE FULL's staging curves (FULL-STORYBOARD 4.3) ---------------------------------------------
# anchor = "target_average" is LOAD-BEARING. THE MULTI-TARGET NULL: SFXData.cs:149 passes a NULL target
# into SetupPositions whenever the cast has >1 target, so every TargetPosition* would evaluate to 0 and
# NIMBRA would render at the world origin (THE MOVEMENT TRAP by a second route). TargetAveragePosition*
# is BTL_VFX_REQ.trgcpos -- always valid -- and its vy is hard-zero (BTL_VFX_REQ.cs:88), so the Y offsets
# below are ABSOLUTE ground-plane heights, not heights above the enemy line.
# Every curve sums to end - start = 260 (FULL-STORYBOARD 4.3's own ledger); the window drains at
# t 315 = PlaySFX (t 55) + 260, the tick nimbra_full.seq's WaitSFXDone is authored on.
[summon.staging]
anchor = "target_average"
start  = 0
end    = 260            # PINNED to ../nimbra_full.seq's two-clock design (FULL-STORYBOARD 4.1)

# Movement: the rise, then a real lateral PASS across the enemy line -- "the circling drift". A literal
# orbit is impossible (Turning1/2 NRE on an FBX curve), so the pass is built from Sinus on X and Z.
# THE ONE UNPROVEN STAGING NUMBER (FULL-STORYBOARD 4.3): the short never moves laterally; if cast 1
# shows clipping or sliding, set every X and Z destination to 0 -- recast-only, and the staging is then
# bit-for-bit the proven short's shape, at the cost of the pass.
[[summon.staging.move]]
duration = 15           # the rise, locked to the emerge entry
from = [0, -900, 0]
to   = [0,  120, 0]
ease = ["Linear", "SinusOut", "Linear"]
[[summon.staging.move]]
duration = 75           # the circling drift, out to stage-left ('from' omitted: Destination inherits
to   = [-160, 160, 60]  # BY EXPRESSION REFERENCE, ParametricMovement.cs:88-105 -- never re-emit it)
ease = ["Sinus", "Sinus", "Sinus"]
[[summon.staging.move]]
duration = 25           # THE LOOK -- it stops travelling and turns
to   = [-160, 170, 60]
ease = ["Constant", "Sinus", "Constant"]
[[summon.staging.move]]
duration = 75           # the pass completes, back across to stage-right (the second gathering)
to   = [160, 180, -80]
ease = ["Sinus", "Sinus", "Sinus"]
[[summon.staging.move]]
duration = 30           # it squares to the line for the blow
to   = [0, 190, 0]
ease = ["SinusOut", "Sinus", "SinusOut"]
[[summon.staging.move]]
duration = 40           # the dissolve's upward vent
to   = [0, 200, 0]
ease = ["Constant", "Sinus", "Constant"]

# Rotation: ABSOLUTE euler, raw to eulerAngles (SFXDataMesh.cs:844) -- THE ROTATION BASELINE LAW,
# (0,180,180) = rung 7's proven facing. Piece 5's SinusOut is computed, not claimed: the lunge lands
# 18/30 in, sin(pi/2 * 0.6) = 0.809 -> Y ~176.9 at the blow, 3.1 degrees off square (the short's was 7.3).
[[summon.staging.turn]]
duration = 15           # square through the rise
from = [0, 180, 180]
to   = [0, 180, 180]
[[summon.staging.turn]]
duration = 75           # yaws into its own travel
to   = [0, 192, 180]
ease = ["Constant", "Sinus", "Constant"]
[[summon.staging.turn]]
duration = 25           # THE LOOK: 24 degrees across, ending 12 off square (the short's own figure)
to   = [0, 168, 180]
ease = ["Constant", "Sinus", "Constant"]
[[summon.staging.turn]]
duration = 75           # stays turned away through the second gathering
to   = [0, 164, 180]
ease = ["Constant", "Sinus", "Constant"]
[[summon.staging.turn]]
duration = 30           # squares up THROUGH the wind-back; SinusOut front-loads it
to   = [0, 180, 180]
ease = ["Constant", "SinusOut", "Constant"]
[[summon.staging.turn]]
duration = 40           # holds square through the dissolve
to   = [0, 180, 180]
ease = ["Constant", "Constant", "Constant"]

# Scaling: the approach, the long hold, then THE DISSOLVE (frames 220-260 = t 275-315, overlapping the
# damage window -- the vent begins on the strike->drift playlist seam).
[[summon.staging.scale]]
duration = 15
from = [0.15, 0.15, 0.15]
to   = [1.0, 1.0, 1.0]
ease = ["SinusOut", "SinusOut", "SinusOut"]
[[summon.staging.scale]]
duration = 205          # full height for the drift, the look, the gathering and the blow
to   = [1.0, 1.0, 1.0]
ease = ["Constant", "Constant", "Constant"]
[[summon.staging.scale]]
duration = 40           # THE DISSOLVE -- the body thins to a thread while stretching upward
to   = [0.02, 1.70, 0.02]
ease = ["SinusIn", "SinusOut", "SinusIn"]

# THE FULL's playlist (FULL-STORYBOARD 4.2): six entries, EVERY ONE AT SPEED 1 (THE SPEED-DIVISOR
# DEFECT, STORYBOARD 11.9: at speed s a clip advances s^2 frames/tick and freezes at 1/s of its entry --
# SIZE THE CLIP TO THE BEAT). Playlist total 295 >= the 260 window, never exhausted.
#   emerge    15   frames   0..15    the rise
#   drift     75   frames  15..90    THE CIRCLING DRIFT (new -- the full's first earned beat)
#   driftlook 25   frames  90..115   THE LOOK, byte-for-byte the short's identity beat
#   drift     75   frames 115..190   THE SECOND GATHERING (new -- the caster causes it)
#   strike    30   frames 190..220   wind-back 190..208 (THE 18-TICK LEAD), LUNGE PEAK at 208 = t 263
#   drift     75   frames 220..295   the dissolve rides it, cut at 260
[[summon.staging.play]]
clip = "emerge"
speed = 1
[[summon.staging.play]]
clip = "drift"
speed = 1
[[summon.staging.play]]
clip = "driftlook"
speed = 1
[[summon.staging.play]]
clip = "drift"
speed = 1
[[summon.staging.play]]
clip = "strike"
speed = 1
[[summon.staging.play]]
clip = "drift"
speed = 1

# --- K4-short: THE WHISPER's staging curves, carried VERBATIM ----------------------------------------
# These are the approved CAST 2 tables, unchanged to the digit -- the deploy gate asserts the re-emitted
# ef091 manifest is byte-identical to the live install's. end = 110 is PINNED: ../nimbra.seq's
# WaitSFXDone beat is authored against it (PlaySFX at tick 25 + 110 = the instance drains at 135).
[summon.short_staging]
anchor = "target_average"
start  = 0
end    = 110

[[summon.short_staging.move]]
duration = 15           # locked to the emerge playlist entry
from = [0, -900, 0]
to   = [0,  120, 0]
ease = ["Linear", "SinusOut", "Linear"]
[[summon.short_staging.move]]
duration = 95           # 'from' omitted -> Destination inherited BY EXPRESSION REFERENCE
to   = [0, 190, 0]      # (ParametricMovement.cs:88-105); re-emitting it would double-evaluate the NCalc
ease = ["Linear", "Sinus", "Linear"]

[[summon.short_staging.turn]]
duration = 15           # square through the rise
from = [0, 180, 180]
to   = [0, 180, 180]
[[summon.short_staging.turn]]
duration = 25           # THE LOOK: the 12-degree turn away
to   = [0, 168, 180]
ease = ["Constant", "Sinus", "Constant"]
[[summon.short_staging.turn]]
duration = 70           # squares up THROUGH the wind-back and holds
to   = [0, 180, 180]
ease = ["Constant", "SinusOut", "Constant"]

[[summon.short_staging.scale]]
duration = 15
from = [0.15, 0.15, 0.15]
to   = [1.0, 1.0, 1.0]
ease = ["SinusOut", "SinusOut", "SinusOut"]
[[summon.short_staging.scale]]
duration = 70           # the hold: the look, the wind-back, the blow
to   = [1.0, 1.0, 1.0]
ease = ["Constant", "Constant", "Constant"]
[[summon.short_staging.scale]]
duration = 25           # THE DISSOLVE, frames 85-110 = ticks 110-135, overlapping the damage window
to   = [0.02, 1.70, 0.02]
ease = ["SinusIn", "SinusOut", "SinusIn"]

[[summon.short_staging.play]]
clip = "emerge"
speed = 1
[[summon.short_staging.play]]
clip = "driftlook"
speed = 1
[[summon.short_staging.play]]
clip = "strike"
speed = 1
[[summon.short_staging.play]]
clip = "drift"
speed = 1

# --- random battles, so NIMBRA has something to be cast at (build auto-adds the after-battle reinit) --
[encounter]
scene = 67                 # Evil Forest / Trail -- the game's first, weakest battles. MULTIPLE enemies is
                           # the point: AllEnemy + >1 target is exactly the case THE MULTI-TARGET NULL
                           # would have broken, so a multi-enemy formation is the real test.
freq = 48
battle_music = 0

[music]
song = 9

# --- a save point: the cast costs MP, and a moogle tent is the cheapest way to run cast N+1 -----------
[[savepoint]]
zone = [[-220, -420], [220, -420], [220, -720], [-220, -720]]
