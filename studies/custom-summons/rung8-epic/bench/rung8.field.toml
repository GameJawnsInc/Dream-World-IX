# RUNG 8 -- THE COMPOSED EPIC: the NIMBRA bench.
#
# Contract: ../STORYBOARD.md (section 6.3 pins this file, section 6.2 the ability, section 6.4 the block).
# A strict SUPERSET of studies/custom-summons/rung3-fresh-id/rung3.field.toml: the same two [[playable]]
# characters, the same room/encounter/music/savepoint, "Bahamut Cinema" still at its allocated id 194 --
# plus the "Nimbra" ability and the [[summon]] block that stages the first fully-ORIGINAL FF9 summon.
#
#   ff9mapkit lint  studies/custom-summons/rung8-epic/bench/rung8.field.toml
#   py studies/custom-summons/rung8-epic/bench/build_rung8_bench.py --check     # staged, install untouched
#   (deploy -> ../RUNBOOK.md; the orchestrator runs it, this lane never touches the install)
#
# >>> DEPLOY THIS BENCH, NOT BOTH <<<  (STORYBOARD R11). rung3.field.toml defines the same two [[playable]]
# rows and therefore writes the same GLOBAL Actions.csv / Commands.csv / CharacterParameters state. This
# toml is the superset -- 30300's cast still works from here -- so let 30301 own the CSVs and do not
# re-deploy 30300 in the same session.

[field]
id = 4814
name = "MISTBENCH"         # -> FBG_N11_MISTBENCH + EVT_MISTBENCH.eb (distinct from 30300's IVIVROOM);
                           #    `deploy_field --id 30301` re-slots it into the dev scratch band.
area = 11
title = "Rung 8 - NIMBRA"

[camera]
pitch = 48.0
distance = 4500
fov = 42.2
[camera.frame]
back = 205
front = 432

[walkmesh]
quad = [[-1220, 257], [1220, 257], [1220, -1931], [-1220, -1931]]
frame = "world"

[[layers]]
image = "art/back.png"
z = 4000
[[layers]]
image = "art/floor.png"
z = 3000

[player]
spawn = [0, -837]

# --- the caster ------------------------------------------------------------------------------------
# Unchanged from rung 3. Iviv boots 80/80 MP at level 1 (magic 40 x the Leveling.csv level-1 BonusMP 200
# / 100), so NIMBRA's 24 MP = THREE casts per fight, which is what iteration needs.
[[playable]]
name = "Iviv"
borrow = "vivi"
recruit = true
custom_battle_model = true
custom_battle_anims = true
portrait = "art/iviv_portrait.png"
stats = { magic = 40 }

[playable.abilities]
preset    = "custom"
menu_from = "vivi"
command2  = "White Magic"
learn = [
  { ability = "Protect", ap = 0 },
]

[playable.abilities.command1]
name = "Spark"
abilities = [
  "Blizzard",
  "Cure",
  { name = "Voltflare", from = "Fire", power = 1, element = ["Thunder"], mp = 18, status = ["Silence"], rate = 50, effect = "[code=MPCost] 0 [/code]" },
  { name = "Soul Leech", from = "Fire", power = 40, element = ["Dark"], mp = 12, script = { template = "drain_hp" } },
  # --- rungs 1+3: the borrowed Bahamut cinematic on the private ef084 folder. KEPT, and kept FIRST, so
  # its allocated custom-ability id (194) does not move and the live M1b/Thomas transplant bench keeps
  # casting off this same CSV state.
  { name = "Bahamut Cinema", from = "Bahamut", targets = "AllEnemy", vfx1 = 84, vfx2 = 405, type = 0 },
  # --- RUNG 8: NIMBRA. The next custom-ability id (195). Every key is load-bearing (STORYBOARD 6.2):
  #   from = "Bahamut"   clones Actions.csv row 62 VERBATIM -- a valid AllEnemy magic-damage row whose
  #                      scriptId is 85. 85 != 87, so Odin's Sword SA is never triggered.
  #   targets="AllEnemy" THE RUNG-1 STRUCTURAL LAW: btl_vfx.cs:99 plays the SHORT vfx2 only for
  #                      (ManyAny && cursor==0) / short_summon / a Beatrix pair. AllEnemy(8) is never
  #                      ManyAny and a minted BattleCommandId 46 never enters DecideSummonType -- so
  #                      WITHOUT the roll feature, vfx1 plays IN FULL on every cast, structurally.
  #   vfx1=80, vfx2=91   THE PAIR (2026-07-24, the short/full roll round). The law above still holds --
  #                      DecideSummonType never fires for command 46 -- but the [[summon]] block's roll
  #                      trio now emits an AbilityFeatures Command-trigger (>SA Global) that writes
  #                      cmd.info.short_summon at CMD_MODE_SELECT_VFX (btl_cmd.cs:594-595), BEFORE
  #                      SelectCommandVfx (:617) reads it -- stock's own 230/170-of-256 odds, stock's
  #                      own Comn.random8() (GetRandom()), post-MP-deduction threshold compensated.
  #                      vfx1 = ef080 = THE FULL (23.0s, FULL-STORYBOARD); vfx2 = ef091 = THE WHISPER
  #                      (9.3s, the approved CAST 2, re-emitted byte-identical). Both OUR folders:
  #                      stock Eidolon content stays structurally unreachable, as rung 3 wanted.
  #                      A SHORT cast deals 2/3 damage (BattleCalculator.cs:515) -- stock-faithful;
  #                      every stock eidolon's sticker power lives under the same rule, so power=34
  #                      needs no retune. Boost (SA 59) still forces full: it registers in saExtended,
  #                      which runs AFTER >SA Global features and overwrites our roll (ff9abil.cs:70-84).
  #   type = 0           THE TYPE-4 MP LAW. Stock Bahamut ships type = 4 and
  #                      `(Type & 4) != 0 && GARNET_SUMMON_FLAG != 0` quadruples the MP cost
  #                      (AbilityUI.cs:1310-1315 + the BattleHUD twin) -- vanilla's early-game summon
  #                      handicap. A scenario-zero New Game HAS that flag set (playtest-caught on this
  #                      very bench: 56 -> 224 MP). Clearing bit 4 is mandatory, not cosmetic.
  #   element=["Dark"]   Mist = soul-refuse; FF9 has no Mist element and Dark is bit 128. An enemy that
  #                      resists/absorbs Dark will flip the result -- thematically correct, fine here.
  #   power=34, mp=24    RE-TUNED 2026-07-24 from 62 (census/DURATION-CENSUS.md 4.4 candidate A). The old
  #                      62/24 was a power/MP ratio of 2.58 against a stock range of 0.94-1.61 (mean
  #                      1.40) -- Leviathan-tier power at Ramuh-tier price, an over-tune INDEPENDENT of
  #                      the duration complaint. 34/24 = 1.42, the stock mean to two decimals, and power
  #                      34 sits between Ramuh (32) and Shiva (36): honestly the weak tier the owner
  #                      asked for. MP stays 24 so Iviv's 80 MP is still THREE casts.
  #                      NOTE the short-cinematic band carries NO power claim (census 3, verdict 3:
  #                      rho = -0.29 without Ark), so the 9.3 s runtime did not force this number -- it
  #                      is chosen on the power/MP line, which is a different axis.
  { name = "Nimbra", from = "Bahamut", targets = "AllEnemy", vfx1 = 80, vfx2 = 91, type = 0, power = 34, element = ["Dark"], mp = 24 },
]

