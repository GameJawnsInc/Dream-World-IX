# RUNG 8 -- the NIMBRA [[summon]] block, staging = "curves" (STORYBOARD section 6.4).
#
# 2026-07-24 THE PAIR: the BENCH block (bench/rung8.field.toml) is now the SHORT/FULL pair -- the full
# (ef080, nimbra_full.seq, FULL-STORYBOARD) as primary/vfx1, THIS cast as `short_sequence`/vfx2 at ef091,
# plus the roll trio (roll_mp/roll_command/roll_ability -> the AbilityFeatures Command-trigger that
# writes cmd.info.short_summon with stock's own 230/170-of-256 odds). THIS FILE REMAINS THE SHORT'S
# STANDALONE SPEC: its K4 tables below are the source of truth the bench's [summon.short_staging]
# carries verbatim, and it is still directly consumable on its own (a single-cast deploy of the WHISPER).
#
# THIS FILE IS THE BLOCK, NOT THE BENCH. Paste this whole `[[summon]]` (and its `[summon.staging]`
# sub-tables) into `rung8.field.toml` -- the wiring lane owns that file, its `[[playable]]` rows, and the
# "Nimbra" ability whose `vfx1`/`vfx2` point at private_ef 91. This block deliberately authors NO ability:
# `[[summon]]` never edits Actions.csv (DESIGN section 1.4).
#
# It is ALSO directly consumable on its own:
#     py -m ff9mapkit summon-deploy --from-toml nimbra.summon.toml --dry-run
#     py build_rung8_stage.py            # the same thing, staged into ./stage/, with input stubs
#
# ---------------------------------------------------------------------------------------------------
# ONE SCHEMA DEVIATION FROM STORYBOARD 6.4, AND IT WAS FORCED (see README.md "THE TWO DEVIATIONS"):
# the storyboard's example writes BOTH `staging = "curves"` AND a `[summon.staging]` table. TOML cannot
# express that -- one key cannot be a string and a table at once, and tomllib raises on the second
# definition. The TABLE IS NOW CANONICAL: the presence of `[summon.staging]` selects curves mode. Every
# other key, value and curve number below is exactly as the storyboard specifies.
# ---------------------------------------------------------------------------------------------------

[[summon]]
lane       = "overlay"                     # DLL-free; runs on STOCK Memoria (no s58, no [SfxHybrid])
model      = "nimbra/6400.fbx"             # <- the creature lane's artifact
id         = 6400
name       = "GEO_MON_B0_M400"
group      = "MON"
private_ef = 91                            # PINNED. 84 is the live Thomas/M1b bench and must stay
                                           # bit-intact; auto-alloc would land on 18 ("apply effect
                                           # instantly"), which is not what a 32-second cast wants.
sequence   = "nimbra.seq"                  # K1 -- an AUTHORED cast. No `donor`: nothing stock is read,
                                           # spliced, or drift-guarded anywhere in this block.
manifest   = "nimbra_manifest.sfxmodel"    # the bare name FileList.txt reveals (STORYBOARD Appendix A)
# K2. ORDER IS LOAD-BEARING: deploy.clip_key_of mints 60000 + list index.
clips      = ["nimbra/emerge.anim", "nimbra/drift.anim", "nimbra/strike.anim",
              "nimbra/driftlook.anim"]
particles  = ["MistFloor.sfxmodel", "MistWisps.sfxmodel", "RiftFlash.sfxmodel"]    # K3

# --- K4: the staging curves (STORYBOARD section 3.3) -----------------------------------------------
# anchor = "target_average" is LOAD-BEARING, not a preference. THE MULTI-TARGET NULL: SFXData.cs:149
# passes a null target into SetupPositions whenever the cast has >1 target, so every TargetPosition*
# would evaluate to 0 and NIMBRA would render at the world origin. TargetAveragePosition* is
# BTL_VFX_REQ.trgcpos -- always valid -- and its vy is hard-set to 0 (BTL_VFX_REQ.cs:88), so the Y
# offsets below are ABSOLUTE ground-plane heights, not heights above the enemy line.
[summon.staging]
anchor = "target_average"
start  = 0
end    = 110            # PINNED, not auto-derived: nimbra.seq's WaitSFXDone beat is authored against it
                        # (PlaySFX at tick 25 + 110 = the instance drains at 135).
                        # RETIMED 2026-07-24 (STORYBOARD 11): 330 -> 110. This is the manifest re-cut the
                        # census's candidate A requires and the free-trim floor could not reach -- every
                        # curve below is re-proportioned WITH it, which is the whole point of STORYBOARD
                        # 7.3's retracted-P3 lesson (no edit after PlaySFX is free; they move together).

# Movement: rise from below the frame in ONE second, then a barely-there continued lift through the
# look, the strike and the dissolve.
[[summon.staging.move]]
duration = 15           # locked to the `emerge` playlist entry (90 frames @ Speed 6 = 15 ticks): the
from = [0, -900, 0]     # rise, the unfurl and the Scaling ramp are one gesture, as authored.
to   = [0,  120, 0]
ease = ["Linear", "SinusOut", "Linear"]
[[summon.staging.move]]
duration = 95           # `from` omitted -> the engine inherits the previous piece's Destination BY
to   = [0, 190, 0]      # EXPRESSION REFERENCE (ParametricMovement.cs:88-105). Do not helpfully re-emit
ease = ["Linear", "Sinus", "Linear"]      # it: that would double-evaluate the NCalc.

# Rotation: ABSOLUTE euler, applied raw to eulerAngles with no battle-actor base (SFXDataMesh.cs:844)
# -- THE ROTATION BASELINE LAW. (0,180,180) is rung 7's proven facing.
# THE ONE KNOB THAT MAY COST A CAST: NIMBRA stands enemy-side, the mirror of rung 7's caster-side
# staging. If cast 1 shows it facing away, flip every Y between 180 and 0 (and 168 -> 12). One line,
# recast-only, no re-export, no relaunch.
[[summon.staging.turn]]
duration = 15           # square through the rise
from = [0, 180, 180]
to   = [0, 180, 180]
[[summon.staging.turn]]
duration = 25           # THE LOOK: the 12-degree turn away, locked to the `drift` entry (frames 15-40)
to   = [0, 168, 180]
ease = ["Constant", "Sinus", "Constant"]
[[summon.staging.turn]]
duration = 70           # squares up THROUGH the wind-back and holds. SinusOut front-loads the motion, so
to   = [0, 180, 180]    # NIMBRA is square-on by the lunge peak (frame 58) rather than after it.
ease = ["Constant", "SinusOut", "Constant"]

# Scaling: the approach (an approach without a camera move), the hold, then THE DISSOLVE -- the body
# thins to a thread while stretching upward, which reads as vapour venting.
[[summon.staging.scale]]
duration = 15           # the approach (an approach WITHOUT a camera move -- STORYBOARD 2.4 lever 3)
from = [0.15, 0.15, 0.15]
to   = [1.0, 1.0, 1.0]
ease = ["SinusOut", "SinusOut", "SinusOut"]
[[summon.staging.scale]]
duration = 70           # the hold: the look (15-40), the wind-back (40-58), the blow (58-85)
to   = [1.0, 1.0, 1.0]
ease = ["Constant", "Constant", "Constant"]
[[summon.staging.scale]]
duration = 25           # THE DISSOLVE, frames 85-110 = ticks 110-135. It now OVERLAPS the damage window
to   = [0.02, 1.70, 0.02]   # (EffectPoints at t 113 / 125) instead of following it -- the shipped build's
ease = ["SinusIn", "SinusOut", "SinusIn"]   # separate 75-tick "hold then dissolve" beat is what that buys.

# The playlist. THE ANIMATION-PLAYLIST LAW: entries chain each clip ONCE and then FREEZE -- there is no
# loop flag and no blending, so `repeat` expands to N identical entries and every clip must open and
# close on the shared `drift` rest pose.
#
# EVERY ENTRY IS SPEED 1, AND THAT IS A LAW NOW -- THE SPEED-DIVISOR DEFECT (STORYBOARD 11.9,
# adversarial round 2026-07-24). `animMaxFrame = ceil(frames / speed)` is a TICK count and
# `animFrame = floor(ticks * speed)` is a CLIP-FRAME index, but SFXDataMesh.cs:869 divides one by the
# other (`clipState.time = length * animFrame / animMaxFrame`). They agree only at speed 1. At speed s
# a clip advances s^2 frames per tick: it finishes after 1/s of its entry and FREEZES for the rest.
# Measured on the pre-fix playlist by `playlist_sim.py`: emerge frozen 12 of 15 ticks, the look frozen
# 16 of 25, strike frozen 15 of 30, and the lunge peak landing at t 74 against a flash at t 83.
#   => size the CLIP to the beat, never the divisor. Speed 1 is also the one value at which both
#      readings of :869 agree, so this is right whichever reading is right.
#
# The tick table, the window and the entry BOUNDARIES are exactly as STORYBOARD 11.2 specifies -- only
# where the frames come from changed:
#   emerge     15 / 1 = 15 ticks   frames   0..15   the rise, 1.0 s
#   driftlook  25 / 1 = 25 ticks   frames  15..40   THE LOOK, the identity beat the census protected
#   strike     30 / 1 = 30 ticks   frames  40..70   wind-back 40..58, THE LUNGE PEAK at 58, settle
#   drift      75 / 1 = 75 ticks   frames  70..145  the eerie half-speed sway (clipped at frame 110)
# Total 15 + 25 + 30 + 75 = 145 >= the 110-tick window, so the playlist is never exhausted and never
# freezes on a last frame. `drift` at N=75 / speed 1 is bit-identical to the shipped build: it was
# already the one entry the defect could not touch.
#
# THE STRIKE STILL LANDS ON THE FLASH. `strike` opens at frame 40 (t 65) and its lunge peak sits at
# 36/59 of the authored envelope, which on a 30-frame clip at speed 1 shows at t 83 -- the exact tick
# nimbra.seq fires the sting, the rift-flash and the relight. (The shipped build put that tick on the
# clip's frame 0, i.e. on the wind-back; the retime aimed the fix at t 83 and the divisor defect was
# landing it at t 74. Same intent, now actually delivered.)
[[summon.staging.play]]
clip = "emerge"
speed = 1
[[summon.staging.play]]
clip = "driftlook"
speed = 1
[[summon.staging.play]]
clip = "strike"
speed = 1
[[summon.staging.play]]
clip = "drift"
speed = 1
