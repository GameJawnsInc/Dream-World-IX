# WHY ROW 2 IS STILL HERE AND IS BYTE-FOR-BYTE CAST B'S
# ==================================================================================================
# The 448 bands were NOT located on screen in either cast, so for THIS read they are dead weight --
# and dead weight was the argument for dropping the row.  It loses.  Four reasons, in order of weight:
