expect_sha256 = "6a3cb4d7fb26c7cd5c497b2fd4b2364039aabb0e491ed7b26e7b6060e0400773"


# ==============================================================================================
# ROW 1 -- THE DISCRIMINATOR.  cell.s0.x704_y384, CHANNEL A, 5 bands, ink byte 0xF0.
# This row is the whole hypothesis, and it is the ONLY thing that moves between cast B and cast C.
[[reskin.texel]]
name = "cell.s0.x704_y384"
source = "C:/gd/SCRATCH/summon-format/repaint-w6b/ef424-channel-a/art-channel-a/cell.s0.x704_y384.verdictbands.inkf0.png"

# --- the guards, EMITTED by the derivation, never typed -----------------------------------------
expect_page_offset = 0x25668     # the s0 id-0 page rect at VRAM (704,256,w=64,h=256), cell 1 of 2
expect_page_bytes  = 16384
expect_page_wh     = [128, 128]
# STATED by the author, CHECKED against the CHANNEL-A derivation -- the same 16,384 bytes are 256
# texels wide at 4bpp, 128 at 8bpp and 64 at 15bpp, and a wrong depth packs to exactly the right byte
# count while painting the wrong picture.  This line is the cast's whole hypothesis, and the kit
# refuses the acknowledgement below WITHOUT it by name.  ★ AND ON CAST C IT IS ALSO THE PREDICTION:
# the three depths this number could take now produce three DIFFERENT screens, which is the entire
# reason the ink byte changed.
expect_bpp         = 8
expect_cell        = [704, 384]

# --- the authored decisions -------------------------------------------------------------------
enabled = true
# THE ONE ACKNOWLEDGEMENT.  Unlike channel G, channel A does NOT license: no `so` reader samples this
# cell and no record the kit could read before W6b-3 names its COLUMN.  The depth comes from an ENTRY
# of a multi-part record's binding array, the entry's ORDER within that array is UNMEASURED, and a
# BINDING IS NOT A DRAW.  Saying the word is the author carrying that judgement; `expect_bpp = 8`
# above is what makes the judgement checkable -- and cast C is what makes it FALSIFIABLE.
acknowledge_array_derived_depth = true
# FALSE, and PROVEN false rather than hoped: the stamp skips every transparent index, so punch = 0 and
# fill = 0.  Cast C strengthens the reason -- at 4bpp the low nibble of 0xF0 IS the cutout index, so
# the 4bpp outcome is a legible THINNING only because the silhouette was left alone.  A cutout reshape
# here would have made the 4bpp and 8bpp screens confusable.
acknowledge_cutout_reshape = false
# DISPLAY only -- this lane writes 0 CLUT bytes; the bands are judged under the column's own palette.
# That is load-bearing on cast C: index 240 is the ink BECAUSE this row colours it rgb(222,115,115),
# and the container remains the palette authority.
palette_from = "pal.s0.x0_y247.e256"
note = "cast C, ROW 1: five bands of literal byte 0xF0 on the CHANNEL-A verdict cell -- salmon at 8bpp, a transparent comb at 4bpp, violet-blue at 15bpp; 5 is still this cell's mark identity"


