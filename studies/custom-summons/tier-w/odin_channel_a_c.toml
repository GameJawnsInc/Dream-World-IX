# TIER W rung W6b-3 CAST C -- THE ODIN DEPTH DISCRIMINATOR.  Stock Odin Short (ef424), the SAME five
# bands on the SAME CHANNEL-A cell as cast B, inked with the byte `0xF0` instead of `0xFF`.
#
# ==================================================================================================
# WHY THIS SPEC EXISTS: CAST B WAS READ, AND THE READ DID NOT DISCRIMINATE
# ==================================================================================================
# Cast B (container sha 69ed527d..., live on the install now) was cast and the video scored.  It
# CONFIRMED two things and it must keep the credit for them:
#
#   * the cell is DRAWN and the surface is `cell.s0.x704_y384` -- cast A gave 10 cycles and cast B 5
#     on the same pixels over the same 282 px span, a threshold-free 2:1 that no stock feature can
#     produce, because a stock feature cannot change its spatial frequency between two casts;
#   * BLADE (GEOM part 1) -> slot 1 -> column 704, IDENTITY ordering -- which rests on the band COUNT
#     and is therefore DEPTH-INVARIANT, so it survives however the depth question resolves.
#
# An adversarial refutation then proved cast B CANNOT answer the DEPTH, and the reason is arithmetic
# rather than optics.  All three of cast B's verdict rows are void:
#
#   * every one of its 2,311 changed bytes is `0xFF`.  At 4bpp that byte is nibbles (15, 15) -- TWO
#     IDENTICAL TEXELS -- so a 4bpp read renders the bands PERFECTLY SOLID.  "Clean vs pin-striped"
#     was never a discriminator;
#   * 87.4 % of the ink's 15bpp words are `0xFFFF` = pure white, so a 15bpp read gives WHITE bands at
#     the SAME rows.  Colour does not separate 8 from 15 either;
#   * band COUNT, ROW POSITION and SOLIDITY are DEPTH-INVARIANT BY CONSTRUCTION -- the stamp writes
#     whole byte ROWS, and a byte row is a texel row at 4, 8 and 15 bpp alike.
#
# What the depth verdict actually rested on, at confidence 0.87, was ONE argument about the
# SURROUNDING STOCK ART: it renders as a coherent dark-red spearhead, 99.9 % red-family, which no
# 4bpp/CLUT-0 read (28.3 % blue) and no 15bpp read (29 % green, 24 % blue) can produce.  **That
# argument uses no ink at all.**  It was available from cast A, or from an unmodified game.  The ink
# cast bought the cell identity and the ordering; it did not buy the depth.
#
# ==================================================================================================
# THE FIX, AND IT IS THE REFUTER'S OWN DESIGN: RE-STAMP WITH `0xF0`
# ==================================================================================================
# THE THREE-WAY TABLE, CARRIED VERBATIM FROM THE REFUTATION:
#
#   | depth                     | `0xF0` renders as                                                 |
#   |---------------------------|-------------------------------------------------------------------|
#   | **8bpp**                  | index 240 = **rgb(222,115,115) SALMON**, luma 147 -- well below   |
#   |                           | saturation, so its hue survives additive blending (reads          |
#   |                           | ~(255,170,170), clearly pink)                                     |
#   | **4bpp** (natural CLUT    | nibbles (0, 15) -> **TRANSPARENT alternating with rgb(24,0,8)**   |
#   |  base)                    | -- the band becomes a 50%-duty 1-texel **transparent comb**       |
#   |                           | ⚠ AND READ THE NEXT PARAGRAPH: the comb is what happens to the    |
#   |                           | BAND, but at 4bpp the WHOLE CELL is already destroyed             |
#   | **15bpp**                 | word `0xF0F0` -> **rgb(131,57,230) VIOLET-BLUE** -- and only 0.1% |
#   |                           | of the javelin body is blue, so it is unmissable                  |
#
# Salmon / shredded nothing / violet.  Three mutually exclusive, unmistakable outcomes, and unlike
# cast B the 8bpp row is a property of THE INK rather than of the stock art around it.
#
# ⚠ ONE CORRECTION TO THE REFUTER'S 4bpp ROW, MEASURED OFF THE PATCHED BYTES AND NOT NEGOTIABLE.
# "The surface visibly THINS" describes what the ink does to the BAND in isolation.  It is not what
# the owner would see, because a 4bpp read does not leave a blade to thin: decoding the SAME 16,384
# bytes at 4bpp/CLUT-0 gives 17.9 % opaque at mean luma 11 -- a dark, shredded, mostly-transparent
# smear with no recognisable spearhead anywhere in it (the stock cell scores the same way: 23.8 % /
# luma 13).  So the 4bpp SCREEN READ is "there is no spearhead", not "the spearhead has five thin
# spots".  The distinction costs nothing here -- both readings are "not salmon bands" -- but a read
# key whose words the render contradicts is exactly the defect that voided cast B, and it is fixed
# rather than inherited.  It also means the 4bpp row buys very little: casts A and B ALREADY showed a
# coherent ornate spearhead, which no 4bpp read can produce.  ★ WHAT CAST C ACTUALLY BUYS THAT
# NOTHING BEFORE IT COULD is the POSITIVE 8bpp row -- an ink-borne measurement of the draw depth AND
# of the ink's palette identity, where cast B's whole depth verdict rested on the stock art.
#
# EVERY NUMBER IN THAT TABLE WAS RE-DERIVED FROM THE USER'S OWN CONTAINER BEFORE THIS SPEC WAS
# WRITTEN, and `odin_band_stamp.py --cast c` prints all of them per run (`*** OTHER DEPTHS`) rather
