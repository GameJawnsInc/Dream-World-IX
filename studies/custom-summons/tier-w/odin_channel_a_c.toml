label  = "odin-w6b3-channel-a-bands-castc"
# The drift guard: sha256 of the pristine stock container in the user's own install.  A HASH, not data.
# EMITTED by `--emit-spec-guards` off `C:/gd/SCRATCH/summon-format/ef424.bytes`, which cast B verified
