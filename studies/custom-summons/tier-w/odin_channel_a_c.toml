# of its non-8bpp rows.  Measured: `pal.s0.x0_y247.e256[240] = 0xb9db = rgb(222,115,115)` OPAQUE;
# `[0] = 0x0000` TRANSPARENT and `[15] = 0x8403 = rgb(24,0,8)`; the direct word `0xF0F0` decodes to
# rgb(131,57,230).  One honest discrepancy, disclosed: the refutation's "luma 147" is Rec.601, while
# this ladder's own ranking luma (`2R+5G+B`, /8) gives 141.8 -- both far below the ~200 where the
# additive pass would clip the hue away, which is the only property the table depends on.
#
# IT ALSO SETTLES WHAT CAST B LEFT UNDECIDABLE.  Cast B could not confirm the ink's palette identity:
# its bands clipped at R=255 and the observed hue (G/R 0.994) actually fitted 15bpp BETTER than the
# authored 8bpp tint (G/R 0.902).  Luma 142-147 does not clip, so cast C's hue is a measurement.
#
# ★ THE SCREEN NUMBER, CALIBRATED ON CAST B'S OWN MEASUREMENT rather than assumed.  Cast B's ink was
# (255,230,246) and its band interiors read (253.8,252.4,253.4) with G clipping only 22.9 % of the
# time; solving `screen = clip(gain*src + backdrop)` on the darkest measured backdrop bin (40-70)
# gives gain ~= 0.86, and that gain reproduces cast B's three clip RATES as the backdrop distribution
# P(bd>=35)=.66 / P(bd>=43)=.61 / P(bd>=57)=.23.  Put cast C's (222,115,115) through the same model:
#
#     backdrop 40 -> (231,139,139)      backdrop 70 -> (255,169,169)      G/R about 0.60
#
# so the refutation's "~(255,170,170)" is the BRIGHT end of the range, not the centre.  Either way it
# is unmistakably pink: against cast B's measured white the separation is dCr = +45 and dY = -72, and
