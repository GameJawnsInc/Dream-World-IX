# ==================================================================================================
# THE LADDER POSITION, UNCHANGED FROM CAST B
# ==================================================================================================
# BINDING-IS-NOT-A-DRAW gated cast B and cast A cleared it: the cell is drawn.  Cast C inherits that
# clearance and needs no new probe -- and it MUST NOT be preceded by one, because a probe container
