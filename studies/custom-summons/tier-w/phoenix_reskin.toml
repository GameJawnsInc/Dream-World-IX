# TIER W rung 5 -- THE RESKIN, SECOND PROOF.  Stock Phoenix (ef211) recoloured in place.
#
# SCAFFOLDED, NOT TYPED.  Every `expect_*` guard, every span offset and the drift hash below came
# out of `py reskin.py scaffold --ef 211`.  Do not retype them; re-scaffold if the install changes.
# What is authored here is only the ART: `hue_to` / `saturation` / `value` / `enabled`.
#
# ==============================================================================================
# READ THIS FIRST -- THE CREATURE IS OFF, AND IT IS OFF BECAUSE THE TOOL REFUSES IT.
#
# The rung was commissioned as GLACIAL PHOENIX: the fire bird rotated to one global cold hue
# (~200 deg ice-blue/cyan) with the scenery co-keyed.  THE SCENERY HALF SHIPPED.  THE CREATURE
# HALF IS REFUSED -- not by taste, and not by a tuning failure, but by `reskin.py`'s own frozen
# quality gate at :1720 (unchanged since W4, so this is the ef227-PROVEN rule, not a new one):
#
#     Gate(min Spearman rho >= 0.90, "relative luminance ordering survives inside every palette")
#
# ef211's six creature rows are pure FIRE RAMPS -- dark-red -> orange -> yellow -> white -- where
# an entry's relative LUMINANCE is carried by its HUE, not by its V.  Rotate the hue and the ramp's
# light/dark modelling inverts: the wing root that was the brightest thing on the page becomes one
# of the darkest.  That is precisely what the rho gate measures, and it fires hard.
#
#   MEASURED EXHAUSTIVELY over the tool's WHOLE knob space
#   (hue delta on a 5-deg grid x saturation 0.0..1.1 x value 0.7..1.0, blowout gate honoured):
#     part0  passes at deltas   0-20, 245-285, 335-355
#     part1  passes at deltas   0-25,          330-355     <- BINDING
#     part2  passes at deltas   0-25,          325-355     <- BINDING
#     part3  passes at deltas   0-25, 245-275, 340-355
#     part4  passes at deltas   0-25, 240-270, 335-355
#     part5  passes at deltas   0-25, 115-120, 230-355
#   THE ONE-HUE RULE takes the INTERSECTION (a shared body material must land on one hue):
#     {0, 5, 10, 15, 20, 340, 345, 350, 355} -- stock +/- 25 deg, ALL OF IT INSIDE THE FIRE BAND.
#     Landing the creature's mean hue anywhere in 180..240 is UNREACHABLE at every saturation and
#     every value.  `value` cannot rescue it by construction: Spearman is rank-based and a scalar
#     V multiplier is monotone, so value moves rho only through 5-bit re-quantisation ties.
#
#   AND THE HEADROOM LAW SEPARATELY FORBIDS A VALUE LIFT: all six rows peak at 31/31 (headroom 0,
#   value ceiling x1.000), so `value > 1.0` refuses without `acknowledge_headroom`.  ef227 was the
#   corpus OUTLIER at <=28.  EVERY `value` IN THIS FILE IS 1.0 -- the whole set is hue+saturation
#   work, which is also why the unspent headroom on the low-peak rows is left unspent.
#
# THE LAW THIS PROVED -- measured over all 17 stock summon creature packages, free saturation,
# one-hue rule applied.  Reachable hue arc, and whether a cold (180-240) key is reachable at all:
#     Ark 381    Sbar 0.310  arc 360  YES        Bahamut 227 Sbar 0.559  arc 360  YES
#     Leviathan  Sbar 0.386  arc 360  YES        Madeen 251  Sbar 0.448  arc 340  YES
#     Odin 261   Sbar 0.501  arc 360  YES        Atomos 184  Sbar 0.459  arc 360  YES
#     Ifrit 276  Sbar 0.656  arc 250  YES        Fenrir x2   Sbar 0.436  arc 140  YES
#     PHOENIX 211 Sbar 0.711 arc  50  NO         REBIRTH 225 Sbar 0.711  arc  50  NO
#   The reskin lever's hue headroom is INVERSELY proportional to the creature's mean saturation.
#   Phoenix and Rebirth Flame are the ONLY two summons in the corpus that cannot reach a cold hue,
#   and they are the two MOST saturated.  The census chose ef211 *because* it was the most
#   saturated ("visually distinctive under a hue shift") -- that criterion was exactly backwards
#   for THIS lever.  For a CREATURE second-proof of the reskin, use Madeen ef251.
#
# The creature rows below are kept at the briefed key with `enabled = false`.  They are not a
# placeholder; they are the authored intent, parked one gate away.  Flipping them true today still
# refuses: there is no `acknowledge_*` key for the rho gate (only `acknowledge_headroom`,
# `acknowledge_shared`, `acknowledge_texanim`).
#
# ==============================================================================================
# WHAT DID SHIP: THE GLACIAL FRONTIER, SET KEY 250 deg.
#
# The second thing the sweep proved: for a fire ramp the structurally CLEAN cold direction is
# BLUE-VIOLET (240-290), not cyan (180-210).  Under the gate's Rec.601 weights (R .299, G .587,
# B .114) a red->yellow ramp rotated toward violet keeps its bright end bright (R stays high, B is
# a light channel); rotated toward cyan it hands the bright end to B and the mid to G, which is
# exactly the inversion.  Measured on the fire field (`pal.s0.x0_y247.e256`, the one page the id-9
# preview map resolves and the largest thing on screen):
#     hue_to 160  rho 0.935   -- passes, but the previews show the bright flame filaments go DARK
#     hue_to 250  rho 0.995   -- the filaments stay bright; deep cold blue with magenta-hot cores
# 250 is therefore the set key, and it is cold, dramatic and self-evidencing rather than merely
# legal.  `previews/sweep-fire-h250.png` vs `previews/sweep-fire-h160.png` is the A/B.
#
# Every enabled row below was derived by searching (hue_to x saturation) against the same rho gate
# and taking the set key where the palette can hold it.  ONE palette cannot: `pal.s0.x0_y245.e256`
# tops out at 240, so it sits 10 deg off key -- stated, not hidden.  TWO are WARM-LOCKED and are
# declared OFF rather than dragged out of key.  Min rho across the shipped set: 0.9445.
#
# THE HARD RULES ARE NOT CONFIGURABLE (`reskin.py`'s module docstring, each one a refusal):
# 0x0000 stays 0x0000; bit 15 (STP) is carried, never recomputed; channels clamp to 0..31; the
# transform runs in HSV over the decoded BGR555 and re-encodes to 5 bits; every changed byte must
# land inside a derived palette inside a derived span.

[reskin]
effect = 211
label  = "phoenix-w5-glacial-frontier"
# The drift guard: sha256 of the pristine stock container in the user's own install.  A HASH, not
# data -- no stock byte is committable.
expect_sha256 = "5d028c0bae621deb6814c504c15d7aa3c9ae9c65ea210011b1403d67e4b509c1"


# ==============================================================================================
# THE SIBLING LANES (D10).  Without this table the self-check falls back to `bahamut_*.toml`,
# notices those target ef227, and SKIPS both orthogonality gates with that stated -- honest, but
# it proves nothing about ef211.  Naming ef211's own camera spec turns the skip into a real
# proof: the reskin's changed-offset set and the rescore's are rebuilt and INTERSECTED, and the
# gate fails if they overlap.  There is no `phoenix_retime.toml` (W5 ships no retime artifact for
# ef211 -- the writing half of that lane is refusal-gated), so `retime` is deliberately left
# unset and keeps skipping against ef227's, which is the truthful state.
[reskin.orthogonality]
rescore = "phoenix_rescore.toml"


# ==============================================================================================
# THE SPANS -- guards on the derivation, auto-named by chunk SLOT (`s{slot}`).  ef211 is
# SINGLE-CHUNK, so W4's cross-chunk second-writer trap is structurally absent; the scaffold's
# hazard census confirms it ("every declared CLUT cell has exactly one writer at one bit depth").
# Envelope 6656 B over 3 spans -- ef227 derives 8192 B over 4.

[reskin.spans.creature_clut_strip]
offset = 0x05f190    # id-4 header: texOffset 0x47190 + texBytes 0x18000, clutBytes 0xc00
length = 3072

[reskin.spans.s0_clut_band0]
offset = 0x000870    # id-0 inline rect 0: VRAM (x=0 y=242 w=256 h=2)
length = 1024

[reskin.spans.s0_clut_band1]
offset = 0x000c78    # id-0 inline rect 1: VRAM (x=0 y=244 w=256 h=5)
length = 2560


# ==============================================================================================
# DEFAULTS -- any target that omits a knob inherits these.  `value` is 1.0 for the whole set and
# no row overrides it (the headroom law).
[reskin.defaults]
saturation = 1.0
value      = 1.0


