# ==============================================================================================
# ==============================================================================================
# VERDICT 2 -- THE DISCRIMINATOR.  ONE TEXEL TARGET: part 1's page, and ONLY the spare frame strip.
#
# WHAT THIS ROW IS FOR.  W7's two recon lanes agree on the format and disagree on the consequence:
# A2 reasons from what the table DESCRIBES (assume it runs -> a localised repaint is unsafe unless
# the frame strip is co-transformed); A1 reasons from what the binary DOES (nothing ticks it -> both
# levers are safe unconditionally).  SYNTHESIS sec 2.3 adopts A1's verdict as the LICENCE and A2's
# co-transform as the INVARIANT.  This row is the experiment that separates them on real bytes, and
# it costs one deploy because it rides along with verdict 1:
#
#   * paint ONE flat SCREAMING index over the spare "eye CLOSED" source strip (78,0,22,12);
#   * leave the LIVE eye window (54,62,22,12) completely alone -- measured 0 changed texels;
#   * then WATCH THE EYE during the cast.
#
#       the eye window NEVER changes across the whole cast  =>  consistent with A1: nothing blits.
#       the eye window EVER shows the flat white slab       =>  the blitter runs after all, A1's
#           exhaustion missed a path, and W7 L4's co-transform becomes MANDATORY, not prudential.
#
#   Verdict 1 is unaffected either way -- which is exactly why both ship in one cast.
#   THIS ONE NEEDS VIDEO, NOT A FRAME (`feedback-video-for-visual-bugs`): the claim is about what the
#   window does across time, and a single still cannot carry it.
#
# THE B4 MIPS CHECK, RUN BEFORE THIS WAS BUILT, PREDICTS "NEVER".  The one hole A1 left open was the
# MIPS escape hatch: ef038's own id-3 program interprets in PSX RAM and could in principle implement
# the missing blitter itself.  Measured statically with the sanctioned tier-R walker (probes in
# `C:/gd/SCRATCH/summon-format/texanim-w7/ef038/`, verdict in `MIPS-CHECK.md`): op 102
# `get_subfile_ptr` -- the ONLY op in ef038's 20-op vocabulary that can hand back a sub-resource
# pointer -- is called 30 times and its return is a call ARGUMENT at 30/30 sites, dereferenced at
# none; there are ZERO load-base dereferences of ANY HLE-returned pointer in the whole image (a copy
# engine that never reads its source cannot copy); all 26 constant-address memory ops land inside the
# program's own id-3 span; and ef038 reaches none of the 50 ops whose `touches_deep` includes
# `vramUploadCallback` (0 VRAM-transfer ops, re-confirmed).  So the expected outcome is NEVER.
#
# THE ART IS NOT IN THIS REPO AND CANNOT BE -- `source` is a decoded stock texture page.  What ships
# is the GENERATOR, `shiva_marker.py`, which derives EVERY parameter (including WHICH RECT) from the
# user's own container and writes exactly this PNG.  Run it before this spec:
#
#     py shiva_marker.py
#
# WHAT `shiva_marker.py` MEASURED ON THE REAL CONTAINER (its own output, not a transcription):
#   texanim       ARMED 116 B at 0x6dfc4..0x6e038, 3 clips, all on part 1
#   DERIVED rects live window (54,62,22,12) | resting spare (56,0,22,12) | MARKED (78,0,22,12)
#   exact-texel agreement with the window: (56,0) 0.9545  <- the resting spare, LEFT STOCK
#                                          (78,0) 0.2273  <- the alternate state, MARKED
#     (that agreement test IS how the rect was chosen -- A2 sec 5.5's own instrument, re-measured.
#      No coordinate is typed anywhere in the generator.)
#   ink   idx 255  stock 0xffff L=255  composed 0xffff L=255 (of 254 sampled indices)
#     ACHROMATIC, so it renders identically under both palettes: verdict 2 does not depend on
#     verdict 1 having landed.  And index 255 occurs 0 times in the live window and 0 times in the
#     resting spare -- the marker is a colour the eye art never uses, which is what makes a capture
#     of it readable.  Both indices already live => the marker costs ZERO CLUT bytes.
#   MEASURED  264 texels filled, 264 actually DIFFER | dead-pad bytes moved 264 |
#             index-0 cutout flips 0 (punch 0 / fill 0)
#   THE INVARIANT  changed texels inside the live window: 0   inside the resting spare: 0
#
#   "dead-pad bytes moved 264" is 264 of 264 and it is CORRECT, not a warning: A2 sec 5.3 measured
#   that every frame rect in every armed table contains ZERO model UV entries (39/39 clips) -- the
#   frame strip is scratch the model never samples.  The generator re-derives that number from the
#   container's own uv pools instead of citing it.  On the model as drawn, the mark is invisible;
#   the ONLY way it can ever reach the screen is if something blits it into the window.  That is the
#   entire experiment.

[[reskin.texel]]
name = "tex.part1"
source = "C:/gd/SCRATCH/summon-format/texanim-w7/ef038/art/tex.part1.png"

# --- the guards, emitted by the derivation, never typed --------------------------------------
expect_page_offset = 0x04b984   # id-4: texOffset 0x47984 + part 1 * 0x4000
expect_page_bytes  = 16384      # 0x4000 -- the page size is a format constant, not a header field
expect_page_wh     = [128, 128]

# --- the authored decisions -------------------------------------------------------------------
enabled = true

# LEFT FALSE ON PURPOSE.  The mark lands entirely inside the spare strip and the measured flip count
# is 0 both ways, so nothing about the silhouette moves -- and if a future edit of the art DID cross
# the transparent-index boundary, this build must stop rather than ship a reshaped Shiva.
acknowledge_cutout_reshape = false

# THE ASYMMETRY, STATED OUT LOUD.  `repaint._gate_texanim_frames` tests each CLIP FAMILY -- the live
# window plus every source frame that can be blitted into it -- and refuses when an edit repaints
# some rects of a family and leaves siblings stock, because that is how a mid-cast flicker gets
# shipped.  This edit is deliberately exactly that shape:
#     clip 0: 1/2 protected rects repainted   <- ASYMMETRIC
#     clip 1: 0/2                              (untouched family: it feeds from the resting spare)
#     clip 2: 1/3 protected rects repainted   <- ASYMMETRIC
# The asymmetry IS THE INSTRUMENT: a symmetric co-transform would paint the window too and the
# experiment would answer nothing, because the window would show the mark whether or not anything
# blits.  So the key is set, and this comment is the reason it is set -- it is not a workaround for
# a gate that fired, it is a statement that this build wants the shape the gate is shaped to catch.
acknowledge_texanim_frames = true

# The page's palette is a HEADER FACT (its own CLUT word), not a choice; naming it here is a
# cross-reference the build CHECKS against the derivation, and it stays a cross-reference -- this
# lane writes zero CLUT bytes and the container remains the palette authority.  It also documents
# that the marked strip and the recoloured row above are the SAME part, which is the point.
palette_from = "creature.part1"

note = "THE DISCRIMINATOR: a flat index-255 slab over the spare 'eye CLOSED' strip (78,0,22,12); the live eye window (54,62,22,12) left stock"
