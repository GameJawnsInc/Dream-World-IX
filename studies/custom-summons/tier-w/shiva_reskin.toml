# TIER W rung W7 -- THE TEXANIM READ, THE CAST ARTIFACT.  Stock Shiva (ef038), BOTH verdicts in one
# container: a whole-creature CLUT recolour to magenta (verdict 1, the LIFT) plus a flat marker
# painted into the spare texanim frame strip (verdict 2, the DISCRIMINATOR).
#
# SCAFFOLDED, NOT TYPED.  Every `expect_*` guard, every span offset and the drift hash below came out
# of `ff9mapkit summon-reskin scaffold --ef 38`.  Do not retype them; re-scaffold if the install
# changes.  What is authored here is only the ART (`hue_rotate` / `saturation` / `value` / `enabled`)
# and the two acknowledgements, each with its reason written out.
#
# ==============================================================================================
# WHY ef038, AND WHY THIS SPEC EXISTS AT ALL
#
# W7 read the texanim table (SYNTHESIS.md).  It is a per-part TEXEL-BLIT clip table: it copies small
# rects of 8-bit palette INDICES from a spare strip into a live window inside ONE creature part's own
# 128x128 page.  It binds no CLUT word, writes no CLUT contents, and cannot reach a scenery page.
# So the pre-W7 refusal -- "an armed texanim refuses a creature recolour outright, and no key lifts
# it" -- was lifted, and this file is the cast that proves the lift on real bytes.
#
# ef038 IS THE MAXIMAL-RISK MEMBER OF THE CLASS, which is the whole reason it is the subject: of the
# 372 stock containers it is the ONLY one that calls op 12 `Hi_StartSummonTexAnim` at all (twice,
# clips 0 and 1).  ef177 / ef493 / ef494 / ef495 carry a nine-clip table nobody ever arms.  Proving
# lever 1 here proves it for all five.
#
# ==============================================================================================
# VERDICT 1 -- THE ONE-FRAME PROOF.  Cast Shiva.  Capture ONE frame with the creature on screen.
#
#     SHIVA IS MAGENTA  =>  the lift is correct.
#
# Why one frame is enough: the two branches the old gate was hedging against -- "a running texanim
# rebinds the per-part CLUT WORD" and "it rewrites CLUT CONTENTS in VRAM" -- would both have the
# creature showing STOCK BLUE during the frames the animation is live.  Magenta anywhere the creature
# is on screen falsifies both.  Nothing about timing, ordering or feel enters the judgement.
#
# ==============================================================================================
# THE KEY: A MAGENTA SHIVA.  Shared `hue_rotate` = +85 deg.
#
# Stock Shiva is a saturated ice-blue: part mean hues 203.5 / 213.2 / 227.1 / 226.7 / 215.7, set
# centre 217.2, S-bar 0.45, V 0.75-0.84.  +85 lands the set centre on 302.2 -- magenta/violet -- and
# every part inside 288..312, which is the point of the form below.
#
# WHY A SHARED `hue_rotate` DELTA AND NOT `hue_to = 300` -- THE ONE-HUE RULE, verbatim from BOTH
# cast-proven creature specs (`bahamut_reskin.toml`:19-23, `madeen_reskin.toml`:37-45): a single body
# material appears across a creature's pages, so `hue_to` -- which computes a DIFFERENT delta per page
# because each page has its own mean -- lands that one material on five different hues and the
# creature fractures.  `hue_to` is the right form for a multi-writer CELL, not for a creature's page
# set.  ef227 shipped +182 this way and ef251 shipped +160 this way; this is +85.
#
# THE MEASUREMENT THAT CHOSE +85 (`p5_delta.py`, sat x1.00 / val x1.00, 5-deg grid, min rho over the
# five parts against the frozen gate at `reskin.py`:1996, rho >= 0.90):
#
#     delta       +70    +75    +80    +85    +90    +95   +100
#     set centre 287.2  292.2  297.2  302.2  307.2  312.2  317.2
#     min rho    .9317  .9410  .9450  .9490  .9555  .9657  .9773
#
#   Every one of those passes.  +85 is taken because it is the delta whose SET CENTRE lands nearest
#   the briefed 300-deg magenta key (302.2), not because it is the safest -- the safest is +355.
#   Per-part at +85:  part0 rho .9490 (binding) | part1 .9598 | part2 .9943 | part3 .9924 | part4 .9674
#   ZERO entries clipped in any of the five (0/255 each), so the blow-out gate is not merely passed,
#   it is untouched.
#
# AND THE TWO-LOBE LAW RE-DERIVED, NOT INHERITED.  W5's M1 refinement says a refusal trough sits on
# the STOCK hue's own complement.  ef038's stock set centre is 217.2, complement 37.2.  Measured
# curve minimum: delta +205, i.e. set centre 62.2, min rho 0.7855 -- within 25 deg of the prediction.
# The refused arc is +160..+220 (13 of 72 deltas; passing arc 295 deg).  ef038 is the MIRROR of the
# fire creatures: a COLD ramp is the one that cannot reach WARM.  Magenta at +85 is nowhere near it.
#
# THE HEADROOM LAW BINDS `value` TO 1.0 EVERYWHERE.  All five creature rows peak at 31/31 (headroom
# 0, value ceiling x1.000), so any `value > 1.0` refuses without `acknowledge_headroom`.  And the
# brief's own instruction is not to lower saturation on a ramp that does not need it, so this is
# pure hue work: `saturation = 1.0`, `value = 1.0`, on every row.
#
# ==============================================================================================
# WHAT IS IN SCOPE.  CREATURE ONLY.  All 17 scenery palettes are declared (so the whole derived
# surface is visible in one place) and left `enabled = false` at IDENTITY.
#
# This is NOT the ef251 situation.  ef038's `so`-record coverage is 28 of 28 GEOM blocks = 100.0%
# COMPLETE, so its unbound palettes are genuinely unbound and a scenery recolour would be perfectly
# legal here.  The reason to leave them stock is THE CAST, not the gate: verdict 1 is "the creature
# is magenta".  If the ice field, the mist sheets and the fifteen material ramps went magenta too,
# the frame would show a magenta SCREEN and "is the creature recoloured?" would stop being decidable
# from it.  Stock-blue scenery around a magenta creature is the contrast that makes one captured
# frame a proof.  One change per in-game test, applied to what the eye can separate.
#
# ==============================================================================================
# THE HARD RULES ARE NOT CONFIGURABLE (`reskin.py`'s module docstring, each one a refusal):
# 0x0000 stays 0x0000; bit 15 (STP) is carried, never recomputed; channels clamp to 0..31; the
# transform runs in HSV over the decoded BGR555 and re-encodes to 5 bits; every changed byte must
# land inside a derived palette inside a derived span.
#
# AND ONE NEW HARD RULE THIS RUNG MINTED, which applies to every build of this file:
#   never resize, relocate or zero the [firstBlock, min(motionOffsets)) texanim region, and never
#   edit `firstBlock` -- `firstBlock == motionOffsets[0]` is a LIVE engine predicate at DLL 0x3e444
#   that changes `Hi_RegisterSummonModel`'s second argument.  `reskin.assert_region_invariant` pins
#   it after every splice; nothing in this file needs to touch it and nothing may.

[reskin]
effect = 38
label  = "shiva-w7-magenta-marker"
# The drift guard: sha256 of the pristine stock container in YOUR install.  A HASH, not data -- no
# stock byte is committable.
expect_sha256 = "8f71a91b5ea8761cb072d0c5aa53fdd6cd926ec03a77634a99bf582fec4eb2a2"

# TEXANIM IS ARMED (116 bytes at 0x6dfc4..0x6e038) and DECODES: 3 clips, all on part 1, one live
# window (54,62,22,12) fed by two source frames (56,0,22,12) and (78,0,22,12).  Under W7 that opens
# every CLUT row below with NO acknowledgement key at all -- the table moves palette INDICES inside
# one page and cannot express a colour change.  The texel half further down is the half that has to
# care, and it says so on its own row.


# ==============================================================================================
# THERE IS DELIBERATELY NO `[reskin.orthogonality]` TABLE ON THIS SPEC, and the three SKIP lines the
# build prints are the truthful state rather than an oversight:
#
# * `rescore` / `retime` -- there is no `shiva_rescore.toml` and no `shiva_retime.toml` on this rung.
#   Pointing those at ef227's specs would intersect against a DIFFERENT container and print as a
#   proof of nothing, which is strictly worse than a stated skip.
# * `reskin` (the texel lane's sibling slot) -- this file carries BOTH levers, so the disjointness
#   that matters is proven by the CLI's own one-spec route: THE COMPOSED HALVES gate rebuilds the
#   CLUT half, intersects its changed-offset set with the texel half's on the same container, and
#   reports `2379 CLUT bytes ... 264 texel bytes ... intersection 0`.  Naming this file as its own
#   `reskin` sibling also works and turns the texel-side skip into an identical intersection -- but
#   it makes the CLUT lane grow a second, confusing skip about a lane it cannot rebuild, for a claim
#   that is already proven one line below.  So: one proof, in the place the kit designates for it.


# ==============================================================================================
# THE SPANS -- guards on the derivation, auto-named by chunk SLOT (`s{slot}`).  ef038 is
# SINGLE-CHUNK, so the cross-chunk second-writer trap is structurally absent; the scaffold's hazard
# census confirms it ("every declared CLUT cell has exactly one writer at one bit depth").
# Envelope 5632 B over 2 spans.

[reskin.spans.creature_clut_strip]
offset = 0x05b984    # id-4 header: texOffset 0x47984 + texBytes 0x14000, clutBytes 0xa00
length = 2560

[reskin.spans.s0_clut_band0]
offset = 0x00086c    # id-0 inline rect 0: VRAM (x=0 y=244 w=256 h=6)
length = 3072


# ==============================================================================================
