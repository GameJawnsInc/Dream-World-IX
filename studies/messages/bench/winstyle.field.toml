# WINSTYLE -- the Tier-1 window-attribute bench + the [[event]] action trigger.
# Layout probed with tools/field_layout_probe.py (the laying-out skill): zones sit at room
# edges / beside their cask landmarks, never across the walk lane; spawn is clear of every
# zone band; all actor pairs >= 300u.
#
#   * on entry: a timed countdown ("On your mark / Get set / GO!") -- `duration` staged captions.
#   * WEST cask (with the "!" bubble): a PRESS-to-read sign -- `trigger = "action"`, `once = false`,
#     `bubble = true`: the moogle-cask-style prompt shows while you stand at it; edge-triggered,
#     repeatable, consumes no flag.
#   * EAST barrel (NO bubble): the pinned Mognet-caption menu -- also press-fired, but silent:
#     stock's discover-by-pressing readable form. The contrast IS the test.
#   * WEST wall pad (cask beside it): a walk-in self-closing no-tail toast (`duration = 90`;
#     `once = false` walk-triggered ON PURPOSE -- the level-trigger re-fire contrast).
#   * EAST wall pad (cask beside it): a walk-in line ATTRIBUTED to the crier NPC (`actor`).
#   * back row: the control bubble / no-tail / transparent talkers.
# Deploy: py tools/deploy_field.py studies/messages/bench/winstyle.field.toml --id 30601

[field]
id = 30601
name = "WINSTYLE"
area = 11

[camera]
pitch = 45

[walkmesh]
quad = [[-1400, -100], [1400, -100], [1400, -2000], [-1400, -2000]]

[player]
spawn = [0, -1700]

# --- the entry countdown: `duration` staged captions -------------------------------------
[[cutscene]]
once = true
steps = [
  { say = "On your mark!", style = "notail", duration = 45 },
  { say = "Get set!", style = "notail", duration = 45 },
  { say = "GO!", style = "notail", duration = 30 },
  { say = "West cask with the ! bubble: press to read. East barrel: press it too (no prompt -- stock's hidden-sign form). The wall pads by the far casks are walk-ins. Talkers at the back.", speaker = "Bench" },
]

# --- WEST cask: the PRESS sign, WITH the "!" bubble --------------------------------------
[[event]]
name = "sign"
zone = [[-1050, -1200], [-750, -1200], [-750, -1030], [-1050, -1030]]
trigger = "action"
bubble = true
message = "= WINSTYLE BENCH =\nA press-to-read sign. Dismiss it: quiet until you press again."
style = "plain"
instant = true
once = false

[[prop]]
prop = "cask"
pos = [-900, -950]

# --- EAST barrel: the pinned Mognet menu, press-fired, SILENT ----------------------------
[[choice]]
zone = [[750, -1200], [1050, -1200], [1050, -1030], [750, -1030]]
prompt = "A pinned menu with the Mognet caption, kupo?"
style = "mognet"
window_pos = [20, 16]
instant = true
options = [
  { text = "Looks right", reply = "Kupo!" },
  { text = "Looks wrong", reply = "Kupooo..." },
]

[[prop]]
prop = "barrel"
pos = [900, -950]

# --- WEST wall pad: the walk-in self-closing toast ---------------------------------------
[[event]]
name = "toast"
zone = [[-1400, -700], [-1150, -700], [-1150, -450], [-1400, -450]]
message = "A no-tail toast. It closes itself in three seconds -- and this one is walk-triggered, so it re-fires while you stand here."
style = "notail"
duration = 90
once = false

[[prop]]
prop = "cask"
pos = [-1050, -575]

# --- EAST wall pad: attributed to the crier ----------------------------------------------
[[event]]
name = "crier_call"
zone = [[1150, -700], [1400, -700], [1400, -450], [1150, -450]]
message = "Hear ye!  This bubble should point at ME, the crier nearby."
speaker = "Crier"
actor = "crier"
once = false

[[prop]]
prop = "cask"
pos = [1050, -575]

# --- the back row of talkers --------------------------------------------------------------
[[npc]]
name = "control"
preset = "vivi"
pos = [-800, -400]
dialogue = "I am the CONTROL: the classic speech bubble, tail at me."
speaker = "Control"

[[npc]]
name = "crier"
preset = "vivi"
pos = [800, -400]
dialogue = "Talk to me directly and I use a fixed chat frame with no tail."
speaker = "Crier"
style = "notail"

[[npc]]
name = "whisperer"
preset = "vivi"
pos = [0, -400]
dialogue = "(frameless text... like a letter, or a thought...)"
speaker = "Whisperer"
style = "transparent"
