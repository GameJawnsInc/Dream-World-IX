# --- THE CASK REVEAL under test -----------------------------------------------------------------
# The moogle spawns HIDDEN at `pos` (inside the cask that stands there) and pops out to
# `reveal_jump_to` the first time the player presses the cask. The press-ZONE below only opens the
# save menu AFTER the pop (before it, the zone is deliberately inert -- that is the gate under test).
# The ACT is left ON (the default), so this also exercises reveal+act composition.
[[savepoint]]
zone = [[-560,-1180],[-40,-1180],[-40,-660],[-560,-660]]   # the press area around the landing spot
pos = [-300, -600]                # the moogle's hidden spawn -- inside the cask
reveal_style = "barrel_pop"
# reveal_from defaults to `pos` -- the cask stands where the moogle hides, and the pop is a
# VERTICAL hop onto it, so there is no landing coordinate to author.
reveal_height = 360
tent = true
# the ground spot the moogle leaps to for the save flourish, clear of the cask
act_hop_to = [-300, -900]

