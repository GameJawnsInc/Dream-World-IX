# ============================================================================
#  WORLD HUB -- generated by `ff9mapkit gen-hub` from journeys.toml.
#  A journey selector: walk as the Moogle, talk to the narrator -> a menu of journeys ->
#  each row warps you into that journey's entry field (the in-game-proven choice `warp`
#  action + `[player] model=`). REGENERATE after editing the journeys.toml -- this file is a
#  build artifact, hand edits are overwritten. (memory: project-ff9-world-hub)
# ============================================================================

[field]
id = 4600
name = "SOUTHERN_RING_HUB"
borrow_bg = "GRGR_MAP420_GR_CEN_0"   # a real room as the backdrop (area >= 10)
area = 21
hide_area_title = true            # borrows an area-title room but isn't that place --
area_title_overlays = [4, 5]    # hide its title card (mapLocalizeAreaTitle.txt)

[camera]
borrow = "camera_hub.bgx"   # the borrowed room's camera (gitignored; extract from your install)
entry_settle = 45   # hold black on entry so the camera settles unseen (no warp-in ease); 0 = off, "auto" = computed

# POST-GENERATION ADDITION (gen-hub does not emit this; re-add after any regenerate).
# Field 950's REAL walkmesh, for OFFLINE content validation only -- NEVER shipped
# (`_borrow_walkmesh`): the engine runs the borrowed room's own mesh. Without it the
# layout probe cannot answer "is the narrator standing on the floor". Gitignored.
[walkmesh]
reference = "walkmesh_hub.bgi"

[player]
spawn = [200, 127]
model = 220   # walk the hub as the Moogle ([player] model=)

[[npc]]
name = "Stiltzkin"   # the narrator -- talk to open the journey menu
pos = [600, 127]
model = 212

# The journey menu: each option warps to a journey's entry field; set_scenario (optional) seeds
# the beat hub-side before the warp. The trailing row has no warp -- it just closes the menu.
[[choice]]
npc = "Stiltzkin"
prompt = "Kupo! Which passage will you book?"
cancel = 1                  # B / cancel -> the last row (no warp)
instant = true                  # pop the menu fully drawn ([IMME]) -- a selector, like FF9 shop menus

[[choice.options]]
text = "The Southern Ring"
warp = 6601
set_scenario = 4100

[[choice.options]]
text = "Not yet, kupo..."   # no warp -- closes the menu
