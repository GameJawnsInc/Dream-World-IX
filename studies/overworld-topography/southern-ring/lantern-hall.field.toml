# lantern-hall.field.toml -- THE LANTERN HALL: the Southern Ring's ferry saloon.
#
# R1 "THE DRY LOOP" (studies/overworld-topography/out/world-design/design_judgment.json
# first_rung). A WORKING COPY of ff9mapkit/examples/continent-v1/waystation.field.toml --
# the bundled example is a byte-exact golden oracle and is NEVER edited in place.
#
# Deltas from the example:
#   * id 6500 -> 6601, name CONT_WAYST -> LANTERN_HALL
#   * text_block = 6601 (the field's OWN id). 22 (Lindblum) would shadow that
#     location's dialogue game-wide -- there is no free REAL text block.
#   * displayed strings re-voiced to the ferry-saloon fiction (purser, berth door)
#   * the berth gateway re-aimed at ASHVALE, the accepted junction island's west
#     shore: quay trigger cell (1,36) world (48,-1168), arrive (60,-1168) facing
#     east (inland), 12u clear of the trigger tile (THE ARRIVAL-CLEARANCE LAW, >=8u)
#
# BG-borrows Daguerreo/Entrance (field 2800, the game's own hidden island harbor) --
# real art + real walkmesh + real camera render engine-side; only OUR .eb ships.
#
# Deploy (from the repo root):
#   py tools/deploy_field.py studies/overworld-topography/southern-ring/lantern-hall.field.toml \
#       --id 6601 --mod-folder FF9CustomMap-world

[field]
id = 6601
name = "LANTERN_HALL"
text_block = 6601                    # the field's OWN id -- NEVER a real block (shadow trap)
borrow_bg = "DGLO_MAP775_DG_ENT_0"   # Daguerreo/Entrance (field 2800), area >= 10
area = 55
hide_area_title = true               # the borrowed room's "Daguerreo" card is not this place

[camera]
borrow = "camera_lantern.bgx"        # field 2800's real camera, `extract-field 2800` then
                                     # copied in beside this toml (asset paths may not climb
                                     # out of the field dir); gitignored -- game-derived bytes
entry_settle = "auto"                # computed hold: the build measures the spawn's warp-in delta

# field 2800's REAL walkmesh, for offline content validation ONLY -- NEVER shipped
# (`_borrow_walkmesh`): the engine runs the borrowed room's own mesh. Without it the
# layout probe cannot answer "is this prop on the floor", which is exactly the check
# an off-floor savepoint failed once before. Gitignored -- game-derived bytes.
[walkmesh]
reference = "walkmesh_lantern.bgi"

[player]
spawn = [0, -2000]                   # just inside the hall door, on the y=0 corridor

# MEASURED corridor (tools/field_layout_probe.py + the reference walkmesh above): the
# hall is a uniform shaft, floor x in [-205, +205] for every z in [-3400, -1000], then
# it flares north of z=-1000. So actor CENTRES must stay in x [-157, +157] (the 48u
# player collision radius off each wall). The example's Mopli at x=170 measured only
# 37u from the east wall -- the player could not have walked up to talk; that is the
# one real defect the probe caught, and both actors moved inward and split along z.
# The Purser is back at R1's PROVEN spot. The berth-row pass had moved him to the west wall
# because (130,-1650) became berth 4's mouth; with the row deleted that conflict is gone, and
# the west wall is now the WRONG side -- at x -130 the restored south-door quad reaches
# z -2353, so a west-wall purser at -2400 would have been standing INSIDE the home door and
# warped out on his first nudge. (Same class of bug as berth 4, found by re-deriving the quad
# edge rather than assuming the old position was still safe.)
# Measured here: 373u from the spawn, 328u from the ledger, in no zone.
[[npc]]
name = "Purser"                      # the ferry purser (white save-moogle rig)
pos = [130, -1650]                   # 75u off the east wall -- R1's measured position
model = 220
dialogue = "Kupo! Lantern Hall, and I am her purser. Talk to me and I will sail you to any port on the ring. The south door walks out to our own quay, and the passage ledger is up the hall, kupo!"

# the passage ledger (save point): its own press area WEST of and DEEPER IN than the
# purser -- 75u off the west wall, 328u from the purser, 565u from the spawn (the
# example's 280u prop/spawn pair projected only 12px apart at this near-level camera).
[[prop]]
model = 220                          # the stock standing save moogle (the purser's rig)
pos = [-130, -1450]

[[savepoint]]
zone = [[-195, -1550], [-65, -1550], [-65, -1350], [-195, -1350]]   # the prop centred in
                                     # its own press area -- the example's proven relation,
                                     # translated with it

# =====================================================================================
# THE HOME DOOR + THE FERRY (R2, redesigned after playtest)
# =====================================================================================
# R2's first attempt put FOUR walk-on berths as east-wall alcoves. It FAILED comprehension
# in-game -- "everything is super clustered... I can't tell what I'm supposed to do. I can
# randomly trigger 1 of 2 warps." The causes were structural, not tunable:
#   * the spawn (0,-2000) sat inside berth III's z-band, 10u west of its sign zone;
#   * the sign zones occupied the CENTRE of a +/-157u walk band, so you crossed them just
#     walking up the hall;
#   * the four warp zones ate the whole east half of that band, so adjacent triggers were
#     one nudge apart;
#   * and the BORROWED ART PAINTS NOTHING at any alcove -- an invisible door cannot be read.
# Four unmarked, mutually-adjacent trigger zones in one corridor is not a layout problem with
# a tuning fix; it is the wrong mechanism for borrowed art.
#
# THE PURSER RUNS THE FERRY instead -- stock FF9's own boat-travel idiom (the Blue Narciss
# captain's "Where to?"). Travel is booked through a PERSON: self-describing, impossible to
# trigger by accident, and it needs no painted doors. The hall keeps ONE walk-on exit: its
# real south door, which is the home-port quay.
#
# Flags 8760-8763 (the deleted berth signs' once-guards) are RETURNED TO THE POOL -- nothing
# references them any more.

# THE HOME DOOR -- field 2800's OWN real exit region, verbatim (the borrowed art's door sits
# exactly there, so this one IS readable). Walking out returns to Ashvale, the home port.
[[gateway]]
to = "worldmap"
zone = [[201, -3377], [-193, -3305], [-193, -2315], [188, -2547]]
arrive = [60.0, -1168.0]             # Ashvale west shore, 12u inland (east) of the quay
                                     # trigger tile (48,-1168) -- THE ARRIVAL-CLEARANCE
                                     # LAW's >=8u, so stepping out never re-fires it
arrive_face = 192                    # facing east = inland, back turned to the sea

# THE FERRY -- talk to the Purser, pick a port. Each destination arm runs the SAME worldmap
# exit body a walk-out gateway does (usercontrol guard -> fade -> both position blocks ->
# POSITION_PRESET_KEY 35 -> computed WorldMap), with its own arrive/face.
#
# ⚠ THE ARRIVES ARE THE QUAYS' OWN GATED POINTS. Each one is the value
# `mint_quay_beacon.SITES[...]` gates that quay's beacon against, and >=8u clear of that
# quay's trigger tile so arriving never instantly re-enters the entrance you just used.
# `probe_marker/probe_quay_sites.py`'s RING-CLOSURE section asserts this file against that
# table on every run -- the two-file duplication is covered, not trusted.
[[ferry]]
npc = "Purser"
prompt = "Where shall we sail, kupo?"
decline = "Not yet, kupo."
decline_reply = "Kupo! The ferry keeps her berth. Come back when you know your port."

[[ferry.destination]]
name = "Ashvale"
arrive = [60.0, -1168.0]
arrive_face = 192                    # east = inland
reply = "The Lantern Quay it is, kupo!"

[[ferry.destination]]
name = "Tidefall"
arrive = [432.0, -1232.0]
arrive_face = 192
reply = "Tidefall, kupo! Mind the spray."

[[ferry.destination]]
name = "Grimhorn"
arrive = [1214.0, -1192.0]
arrive_face = 192
reply = "Grimhorn, kupo. Cold water there."

[[ferry.destination]]
name = "Larkspur"
arrive = [688.0, -616.0]
arrive_face = 64                     # WEST = inland on Larkspur -- the one that differs
reply = "Larkspur, kupo! The long crossing."
