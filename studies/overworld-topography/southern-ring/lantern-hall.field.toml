# lantern-hall.field.toml -- THE LANTERN HALL: the Southern Ring's ferry saloon.
#
# R1 "THE DRY LOOP" (studies/overworld-topography/out/world-design/design_judgment.json
# first_rung). A WORKING COPY of ff9mapkit/examples/continent-v1/waystation.field.toml --
# the bundled example is a byte-exact golden oracle and is NEVER edited in place.
#
# Deltas from the example:
#   * id 6500 -> 6601, name CONT_WAYST -> LANTERN_HALL
#   * text_block = 6601 (the field's OWN id). 22 (Lindblum) would shadow that
#     location's dialogue game-wide -- there is no free REAL text block.
#   * displayed strings re-voiced to the ferry-saloon fiction (purser, berth door)
#   * the berth gateway re-aimed at ASHVALE, the accepted junction island's west
#     shore: quay trigger cell (1,36) world (48,-1168), arrive (60,-1168) facing
#     east (inland), 12u clear of the trigger tile (THE ARRIVAL-CLEARANCE LAW, >=8u)
#
# BG-borrows Daguerreo/Entrance (field 2800, the game's own hidden island harbor) --
# real art + real walkmesh + real camera render engine-side; only OUR .eb ships.
#
# Deploy (from the repo root):
#   py tools/deploy_field.py studies/overworld-topography/southern-ring/lantern-hall.field.toml \
#       --id 6601 --mod-folder FF9CustomMap-world

[field]
id = 6601
name = "LANTERN_HALL"
text_block = 6601                    # the field's OWN id -- NEVER a real block (shadow trap)
borrow_bg = "DGLO_MAP775_DG_ENT_0"   # Daguerreo/Entrance (field 2800), area >= 10
area = 55
hide_area_title = true               # the borrowed room's "Daguerreo" card is not this place

[camera]
borrow = "camera_lantern.bgx"        # field 2800's real camera, `extract-field 2800` then
                                     # copied in beside this toml (asset paths may not climb
                                     # out of the field dir); gitignored -- game-derived bytes
entry_settle = "auto"                # computed hold: the build measures the spawn's warp-in delta

# field 2800's REAL walkmesh, for offline content validation ONLY -- NEVER shipped
# (`_borrow_walkmesh`): the engine runs the borrowed room's own mesh. Without it the
# layout probe cannot answer "is this prop on the floor", which is exactly the check
# an off-floor savepoint failed once before. Gitignored -- game-derived bytes.
[walkmesh]
reference = "walkmesh_lantern.bgi"

[player]
spawn = [0, -2000]                   # just inside the hall door, on the y=0 corridor

# MEASURED corridor (tools/field_layout_probe.py + the reference walkmesh above): the
# hall is a uniform shaft, floor x in [-205, +205] for every z in [-3400, -1000], then
# it flares north of z=-1000. So actor CENTRES must stay in x [-157, +157] (the 48u
# player collision radius off each wall). The example's Mopli at x=170 measured only
# 37u from the east wall -- the player could not have walked up to talk; that is the
# one real defect the probe caught, and both actors moved inward and split along z.
# R2: the Purser moved to the WEST wall. He stood at (130,-1650), which the berth layout
# below turns into the mouth of berth 4 -- an actor standing INSIDE a gateway zone, i.e. an
# instant warp the moment he was nudged. Now he faces the berth row from across the hall,
# 420u from the spawn and 950u from the ledger (both >= the 300u comfortable spacing).
[[npc]]
name = "Purser"                      # the ferry purser (white save-moogle rig)
pos = [-130, -2400]                  # 75u off the WEST wall, opposite the middle of the row
model = 220
dialogue = "Kupo! Lantern Hall. Four berths along the east wall -- Ashvale, Tidefall, Grimhorn, Larkspur. Step into the one you want. Log your passage on the ledger up the hall first, kupo!"

# the passage ledger (save point): its own press area WEST of and DEEPER IN than the
# purser -- 75u off the west wall, 328u from the purser, 565u from the spawn (the
# example's 280u prop/spawn pair projected only 12px apart at this near-level camera).
[[prop]]
model = 220                          # the stock standing save moogle (the purser's rig)
pos = [-130, -1450]

[[savepoint]]
zone = [[-195, -1550], [-65, -1550], [-65, -1350], [-195, -1350]]   # the prop centred in
                                     # its own press area -- the example's proven relation,
                                     # translated with it

# =====================================================================================
# THE BERTH ROW (R2) -- four EAST-WALL, DEPTH-STAGGERED ALCOVES
# =====================================================================================
# R1 shipped ONE berth door using field 2800's own real exit region (a big quad across
# the hall's south end). R2 replaces it with four alcoves ranged up the east wall, so the
# hall reads as a ferry saloon with a berth per island rather than a single exit.
#
# Layout (owner-ruled): each zone is x[80,205] -- from 125u short of the east wall out to
# the wall itself -- by +/-90u deep, centred at z -2700 / -2350 / -2000 / -1650. 350u of
# clear corridor between mouths, so you cannot be in two at once, and every zone sits on
# the measured floor (x[-205,205] for z[-3400,-1000]).
#
# ⚠ EACH BERTH NEEDS ITS OWN `arrive`. The engine's position-mirror return is racy for
# teleported/short visits, so the landing is pinned explicitly per berth -- and each one
# is the quay's OWN gate-verified arrive point, >=8u clear of that quay's trigger tile
# (THE ARRIVAL-CLEARANCE LAW) so stepping out never re-fires the entrance you arrived at.
# The four coords are the same ones `mint_quay_beacon.SITES` gates the beacons against.
#
# The signs below sit in the 68u of corridor just WEST of each mouth: you read the berth
# name on approach, THEN cross into the gateway. They are `[[event]]` zones, not props --
# a sign with a model would be an actor in a 410u-wide corridor and would breach the
# spacing rules the probe enforces; a zone has no collision and no footprint.

# berth 1 -- ASHVALE (the Lantern Quay, junction island west shore)
[[event]]
zone = [[10, -2790], [78, -2790], [78, -2610], [10, -2610]]
message = "Berth I -- ASHVALE.   The Lantern Quay, on the junction island's west shore."
flag = 8760                          # >= FIRST_SAFE_FLAG (8712); the kit's 8000 default
                                     # sits below the safe band (flags.py:46-48)
[[gateway]]
to = "worldmap"
zone = [[80, -2790], [205, -2790], [205, -2610], [80, -2610]]
arrive = [60.0, -1168.0]             # 12u east (inland) of trigger (48,-1168)
arrive_face = 192                    # east = inland, back to the sea

# berth 2 -- TIDEFALL
[[event]]
zone = [[10, -2440], [78, -2440], [78, -2260], [10, -2260]]
message = "Berth II -- TIDEFALL."
flag = 8761
[[gateway]]
to = "worldmap"
zone = [[80, -2440], [205, -2440], [205, -2260], [80, -2260]]
arrive = [432.0, -1232.0]            # 12u east of trigger (420,-1232)
arrive_face = 192

# berth 3 -- GRIMHORN
[[event]]
zone = [[10, -2090], [78, -2090], [78, -1910], [10, -1910]]
message = "Berth III -- GRIMHORN."
flag = 8762
[[gateway]]
to = "worldmap"
zone = [[80, -2090], [205, -2090], [205, -1910], [80, -1910]]
arrive = [1214.0, -1192.0]           # 10u east of trigger (1204,-1192) -- the tightest of
                                     # the four, still >=8u
arrive_face = 192

# berth 4 -- LARKSPUR
[[event]]
zone = [[10, -1740], [78, -1740], [78, -1560], [10, -1560]]
message = "Berth IV -- LARKSPUR."
flag = 8763
[[gateway]]
to = "worldmap"
zone = [[80, -1740], [205, -1740], [205, -1560], [80, -1560]]
arrive = [688.0, -616.0]             # 12u WEST of trigger (700,-616) -- inland is WEST on
                                     # Larkspur, hence the different face below
arrive_face = 64                     # west = inland
