# =====================================================================================
# THE SINE KIT, RUNG 0 -- computed prop motion in-game  --  field 30945
# =====================================================================================
# One flat floor, two plain kit props. The MOTION is not authored here: studies/sine-kit/sine0_bench.py
# seats a code-entry DAEMON into the deployed .eb (the rung-0 bench is study-local -- no kit code), which
# every tick mirrors both props' published transform, advances a clock, and re-places them with
# MoveInstantXZYEx 0xAD (x, the negated-height operand, z) + TurnInstantEx 0x87 driven by B_SIN / B_COS / B_SIN2:
#   balloon  (A)  orbit r=300 around (0,-800), 128 ticks a turn, height 150, facing along its travel
#   cask     (B)  the same orbit half a turn behind A, plus a vertical bob of +-60 every 256 ticks
#
#   py studies/sine-kit/sine0_bench.py deploy      (deploys 30945, then patches the live .eb)
#   py tools/play.py studies/sine-kit/rung0_sine.py --label sine-rung0

